<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoterPup — your pup remembers</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --bg:#f6f8fa; --card:#ffffff; --ink:#212b36; --sub:#5b6b7c;
         --accent:#2f7d5f; --gold:#e8b84b; --goldink:#2a2418; --line:#e3e9ee; --chip:#eef2f5; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:max(18px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom));
       display:flex; justify-content:center}
  .wrap{width:100%; max-width:560px}
  .brand{color:var(--gold); font-size:21px; font-weight:800; margin-bottom:12px}
  .q{font-size:23px; font-weight:700; line-height:1.32; margin:4px 0 10px}
  .hint{color:var(--sub); font-size:13px; margin:0 0 12px}
  textarea,input{width:100%; background:var(--chip); color:var(--ink); border:1px solid var(--line);
       border-radius:12px; padding:13px; font-size:16px}
  textarea{min-height:80px; resize:vertical}
  .btn{display:block; width:100%; background:var(--accent); color:#eaf5ef; border:0; border-radius:12px;
       padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer; margin-top:12px}
  .btn.gold{background:var(--gold); color:var(--goldink)}
  .btn.ghost{background:var(--chip); color:var(--sub); border:1px solid var(--line)}
  .btn:disabled{opacity:.45}
  .btnrow{display:flex; gap:8px}
  .btnrow .btn{flex:1}
  .sub{font-size:11px; opacity:.75; font-weight:400; margin-top:2px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .chip{background:var(--chip); border:1px solid var(--line); color:var(--sub); border-radius:999px;
        padding:6px 12px; font-size:12.5px; cursor:pointer}
  .chip.goldline{border-color:var(--gold); color:var(--gold)}
  .chip.same{border-color:#d9c38a; color:#8a6a14; background:#fff; font-weight:700; cursor:pointer}
  .chip.same.on{background:#faf3df; border-color:var(--gold); color:#7a5a0c}
  .chip.same.static{cursor:default}
  .chip.goldfill{background:#faf3df; border-color:var(--gold); color:var(--gold); font-weight:700; cursor:default}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px}
  .privacy{color:var(--sub); font-size:12.5px; margin:12px 0 2px}
  .entry-body{font-size:15px}
  .ts{color:#7d8da0; font-size:11.5px; margin-top:5px}
  .count{color:var(--sub); font-size:13px; margin:14px 0}
  /* ceremony — squash & stretch, staged */
  .scene{height:250px; display:flex; align-items:flex-end; justify-content:center; position:relative; margin:20px 0 4px}
  .gift{font-size:82px; z-index:2; transform-origin:50% 90%;
        animation: giftshake .9s ease-in-out 1, giftpop .3s ease-in 1.0s forwards}
  @keyframes giftshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(7deg)}
        45%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
  @keyframes giftpop{60%{transform:scale(1.25); opacity:.7}100%{transform:scale(1.7); opacity:0}}
  .paw{position:absolute; bottom:84px; left:50%; font-size:20px; opacity:0; z-index:1}
  .p1{animation:pawfly .85s ease-out 1.02s forwards} .p2{animation:pawfly2 .9s ease-out 1.05s forwards}
  .p3{animation:pawfly3 .8s ease-out 1.08s forwards} .p4{animation:pawfly4 .95s ease-out 1.03s forwards}
  .p5{animation:pawfly5 .85s ease-out 1.07s forwards}
  @keyframes pawfly {10%{opacity:1}100%{opacity:0; transform:translate(-90px,-120px) rotate(-40deg)}}
  @keyframes pawfly2{10%{opacity:1}100%{opacity:0; transform:translate(70px,-140px) rotate(35deg)}}
  @keyframes pawfly3{10%{opacity:1}100%{opacity:0; transform:translate(-40px,-160px) rotate(-15deg)}}
  @keyframes pawfly4{10%{opacity:1}100%{opacity:0; transform:translate(110px,-90px) rotate(50deg)}}
  @keyframes pawfly5{10%{opacity:1}100%{opacity:0; transform:translate(10px,-175px) rotate(10deg)}}
  .pupimg{width:84px; height:84px; border-radius:50%; object-fit:cover; object-position:55% 45%;
          border:3px solid var(--gold); box-shadow:0 6px 18px rgba(232,184,75,.35);
          position:absolute; bottom:40px; opacity:0; transform-origin:50% 100%;
          animation: puprise 1.05s cubic-bezier(.22,1,.36,1) 1.1s forwards}
  @keyframes puprise{0%{opacity:0; transform:translateY(95px) scale(.25)}
        45%{opacity:1; transform:translateY(-16px) scale(1.06)}
        62%{transform:translateY(0) scale(1.14,.86)}
        78%{transform:translateY(-5px) scale(.94,1.06)}
        90%{transform:translateY(0) scale(1.04,.97)}
        100%{opacity:1; transform:translateY(0) scale(1)}}
  .cap{font-size:34px; position:absolute; bottom:106px; margin-left:-10px; z-index:3; opacity:0; transform-origin:50% 100%;
       animation: capdrop .55s cubic-bezier(.34,1.56,.64,1) 2.25s forwards}
  @keyframes capdrop{0%{opacity:0; transform:translateY(-130px) rotate(20deg)}
        70%{opacity:1; transform:translateY(4px) rotate(-16deg)}
        100%{opacity:1; transform:translateY(0) rotate(-14deg)}}
  .tag{position:absolute; bottom:14px; background:var(--gold); color:var(--goldink); font-weight:900;
       letter-spacing:1px; font-size:13px; border-radius:8px; padding:3px 10px; opacity:0; z-index:4;
       box-shadow:0 2px 8px rgba(232,184,75,.4);
       animation:pop .45s cubic-bezier(.34,1.56,.64,1) 2.7s forwards}
  @keyframes pop{0%{opacity:0; transform:scale(0) rotate(-6deg)}70%{opacity:1; transform:scale(1.15) rotate(2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  .ready{opacity:0; animation:fadein .4s ease 3.1s forwards; text-align:center}
  @keyframes fadein{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .pupimg,.cap,.tag,.ready,.paw{animation:none; opacity:1}
        .gift{animation:none; opacity:0} .paw{display:none} }
  .pulse{animation:pulsebtn 1.25s ease-in-out infinite}
  @keyframes pulsebtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04); box-shadow:0 5px 18px rgba(232,184,75,.5)}}
  .reveal{opacity:0; transition:opacity .5s ease}
  .reveal.show{opacity:1}
  .namefield{margin-top:10px}
  .unboxwrap{position:relative; width:100%; max-width:300px; margin:8px auto 4px; border-radius:18px; overflow:hidden;
      aspect-ratio:9/16; max-height:58vh; background:#e9edf1; box-shadow:0 6px 24px rgba(16,24,40,.12)}
  .unboxwrap video{width:100%; height:100%; object-fit:cover; display:block}
  .unboxwrap .tag{bottom:14px; left:50%; transform:translateX(-50%) scale(0)}
  @keyframes poptag{0%{opacity:0; transform:translateX(-50%) scale(0)}70%{opacity:1; transform:translateX(-50%) scale(1.15)}100%{opacity:1; transform:translateX(-50%) scale(1)}}
  .unboxwrap .tag{animation:poptag .45s cubic-bezier(.34,1.56,.64,1) 3.1s forwards}
  .fetchcard{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:8px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .fetchcard video{width:78px; height:120px; object-fit:cover; border-radius:12px; flex:0 0 auto; background:#e9edf1}
  .fetchcard .ft{font-size:14px; font-weight:700; line-height:1.35}
  .fetchcard .ft small{display:block; font-weight:500; color:var(--sub); font-size:12px; margin-top:3px}
  .fetchvid{position:relative; width:78px; height:120px; flex:0 0 auto}
  .fetchvid video{position:absolute; inset:0; width:78px; height:120px; object-fit:cover; border-radius:12px; background:#e9edf1}
  .fetchvid .vtop{z-index:2; transition:opacity .35s}
  .fetchvid img.vsit{position:absolute; inset:0; width:78px; height:120px; object-fit:cover; border-radius:12px; background:#e9edf1}
  .mcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin:0 0 12px;
      box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .mcard .mh{font-size:15px; font-weight:800; margin-bottom:4px}
  .mcard .mp{font-size:12.5px; color:var(--sub); margin:0 0 8px}
  .mcard .btn{margin-top:6px}
  .herorow{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:10px; margin:0 0 12px}
  .herorow .fetchcard{margin:0; align-items:flex-start; gap:10px}
  .herorow .fetchcard .ft{font-size:13.5px}
  .herorow .fetchcard .ft small{font-size:11.5px}
  .sharetile{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px;
      box-shadow:0 1px 2px rgba(16,24,40,.05); display:flex; flex-direction:column; gap:7px; min-width:0}
  .slotmedia{position:relative; width:100%; border-radius:12px; overflow:hidden; background:#e9edf1}
  .slotmedia video,.slotmedia img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .slotmedia .slotonce{z-index:2; transition:opacity .35s}
  .hpill{display:flex; align-items:center; justify-content:center; gap:6px; font-size:11.5px; font-weight:800; color:#7a5a0c;
      background:#faf3df; border:1px solid var(--gold); border-radius:999px; padding:4px 8px; text-decoration:none;
      white-space:nowrap; cursor:pointer; margin-top:7px}
  .hpill.off{opacity:.55}
  .hacts .bkbadge,.hacts .bklink{margin:7px 0 0 0}
  .hpill .stkthumb,.hpill .stkthumb img{width:40px; height:24px; border-radius:4px}
  .sharetile .shcap{font-size:12.5px; font-weight:800; line-height:1.25; margin-top:auto}
  .sharetile .slotmedia{flex:1 1 auto; min-height:64px; height:auto}
  .fetchvid .bkbadge,.fetchvid .bklink{position:absolute; left:4px; right:4px; bottom:4px; z-index:3; margin:0;
      text-align:center; font-size:10px; padding:2px 4px; background:rgba(255,255,255,.92)}
  .herorow .fetchcard .ft{display:flex; flex-direction:column; min-height:120px}
  .herorow .hacts{margin-top:auto; display:flex; flex-wrap:wrap; align-items:center; gap:4px}
  .shbtn{display:block; text-align:center; font-size:12px; font-weight:800; color:#7a5a0c; background:#faf3df;
      border:1px solid var(--gold); border-radius:999px; padding:6px 4px; text-decoration:none; white-space:nowrap}
  .shbtn.off{opacity:.55; cursor:default}
  .sharetile .stkcard{margin-top:0; justify-content:center}
  .sharetile .stkthumb,.sharetile .stkthumb img{width:56px; height:34px}
  .packhero{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:8px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .packhero .slotmedia{width:78px; height:100px; flex:0 0 auto}
  .packhero .ft{font-size:14px; font-weight:700; line-height:1.35}
  .packhero .ft small{display:block; font-weight:500; color:var(--sub); font-size:12px; margin-top:3px}
  .momwrap{margin:14px 0 4px}
  .momwrap .mhead{font-size:12px; font-weight:800; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 8px}
  .momgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .mtile{border-radius:14px; color:#fff; padding:11px 12px; min-height:104px; cursor:pointer; position:relative;
      display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .mtile.red{background:#a94b4b} .mtile.est{background:repeating-linear-gradient(135deg,#a94b4b 0 10px,#9a4343 10px 20px); opacity:.92}
  .offices{font-size:11.5px; color:var(--sub); margin:8px 2px 0} .offices a{color:#3b6fb6; font-weight:700; text-decoration:none; margin-right:8px; white-space:nowrap}
  .mtile.red{background:#a94b4b} .mtile.green{background:#2f7d5f} .mtile.blue{background:#3b6fb6}
  .mtile .mk{font-size:10.5px; font-weight:800; letter-spacing:.5px; opacity:.9; text-transform:uppercase}
  .mtile .md{font-size:24px; font-weight:900; line-height:1}
  .mtile .md small{font-size:12px; font-weight:700; opacity:.9}
  .mtile .mn{font-size:12.5px; font-weight:700; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2;
      -webkit-box-orient:vertical; overflow:hidden}
  .mtile.on{outline:3px solid var(--gold); outline-offset:2px}
  .mpanel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:10px;
      font-size:12.5px; color:var(--sub); white-space:pre-line}
  .mpanel b{color:var(--ink)}
  .mpanel a{display:inline-block; margin:6px 8px 0 0; color:#3b6fb6; font-weight:700; text-decoration:none}
  .mpanel .vitem{margin-top:6px; white-space:normal}
  .mpanel .qname{color:var(--ink); font-weight:700; margin-top:8px}
  .stkover{position:fixed; inset:0; z-index:50; background:rgba(16,22,29,.62); display:flex;
      align-items:flex-end; justify-content:center; padding:16px}
  .stksheet{background:var(--card); border-radius:18px; padding:16px; width:100%; max-width:440px;
      box-shadow:0 10px 40px rgba(0,0,0,.25); margin-bottom:env(safe-area-inset-bottom)}
  .stksheet img{width:100%; border-radius:10px; border:1px solid var(--line); display:block}
  .stksheet .hint{margin:8px 2px 0; text-align:center}
  .stkcard{cursor:pointer; display:inline-flex; align-items:center; gap:6px; margin-top:7px}
  .stkcard .stkcap{font-size:11.5px; font-weight:700; color:#8a6a14}
  .bkbadge,.bklink{display:inline-block; margin:7px 0 0 8px; font-size:11px; font-weight:700; vertical-align:middle;
      padding:3px 8px; border-radius:999px; text-decoration:none}
  .bkbadge{color:#2f7d5f; background:#eef6f2; border:1px solid #cfe5da}
  .bklink{color:#3b6fb6; background:var(--card); border:1px solid var(--line)}
  .stkthumb{position:relative; width:72px; height:43px; border-radius:6px; overflow:hidden; border:1px solid var(--line); background:#fff; flex:0 0 auto}
  .stkthumb img{width:72px; height:43px; display:block}
  .stkblur{position:absolute; top:0; right:0; bottom:0; width:50%; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
      background:rgba(255,255,255,.3)}
  .backup{margin:0 0 12px}
  .backup .btn{margin-top:0}
  .nav{justify-content:space-between}
  .acct{font-size:13px; font-weight:700; color:#3b6fb6; text-decoration:none; padding:5px 10px;
      border:1px solid var(--line); border-radius:999px; background:var(--card)}
  .navr{display:flex; gap:6px; align-items:center}
  .acct.show{color:#8a6a14; border-color:var(--gold); background:#faf3df}
  @media (max-width:380px){ .acct{padding:5px 8px; font-size:12px} .brand{font-size:15px} }
  .viewsum{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 12px}
  .switchrow{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--ink); margin:10px 2px}
  .switchrow input{width:auto; transform:scale(1.2)}
  .linkbox{background:var(--chip); border:1px dashed var(--gold); border-radius:12px; padding:12px;
           font-size:13px; word-break:break-all; margin-top:10px}
  .qrwrap{display:flex; justify-content:center; margin:14px 0}
  .qrwrap img{border-radius:10px; background:#fff; padding:10px}
  .kioskqr img{width:78vw; max-width:420px}
  .banner{background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
          color:var(--sub); font-size:13px; margin-top:14px}
  footer{text-align:center; color:var(--sub); font-size:12.5px; margin-top:24px}
  footer a{color:var(--sub)}
  .nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .nav .brand{margin:0}
  .nav a{color:var(--gold); font-size:13.5px; font-weight:700; text-decoration:none}
  .packtag{color:var(--sub); font-size:13px; margin:2px 0 12px}
  .searchbar{width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:11px 13px; font-size:15px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .tilegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{border-radius:14px; color:#fff; padding:12px; min-height:118px; position:relative; overflow:hidden;
      cursor:pointer; display:flex; flex-direction:column; justify-content:flex-end;
      background-size:cover; background-position:center; box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .tile .tcount{position:absolute; top:8px; right:11px; font-weight:900; font-size:19px; opacity:.95}
  .tile .tname{font-weight:800; font-size:13px; letter-spacing:.3px; margin-top:6px}
  .tile .tsnippet{font-size:12.5px; line-height:1.35; opacity:.95; min-height:34px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      transition:opacity .45s}

  .tile .tbg{position:absolute; inset:0; background-size:cover; background-position:center; transition:opacity .7s ease}
  .tile .tcount,.tile .tsnippet,.tile .tname{position:relative; z-index:1}
  .tile .tcount{position:absolute}
  .mombody .vitem{margin-top:6px}
  .mombody .vitem a{margin:0; font-weight:700}
  .mombody .vitem span{color:var(--sub)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start}

  .grid2 .media img,.grid2 .media video{max-height:110px}
  .grid2 .chips{gap:5px}
  .grid2 .chip{padding:4px 8px; font-size:10.5px}
  .grid2 .ts{font-size:10.5px}
  .backchip{margin-bottom:10px; display:inline-block}
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; z-index:9;

          padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1; text-align:center; padding:9px 0 7px; text-decoration:none;

function mediaHold(x){

  if (x.hidden === 'held') return '<div class="chip" style="display:inline-block;margin-top:8px;cursor:default">📷 photo · not shown publicly</div>';
  if (x.hidden === 'blocked') return '<div class="chip" style="display:inline-block;margin-top:8px;cursor:default">🚫 image removed</div>';
  return '<div class="chip" style="display:inline-block;margin-top:8px;cursor:default">🕑 photo under review</div>';
}
function mediaHTML(m){
  if (!m || !m.length) return '';

    if (!x.url) return mediaHold(x);

      ? '<video src="' + esc(x.url) + '" controls playsinline preload="metadata"></video>'
      : '<img src="' + esc(x.url) + '" loading="lazy">';
  }).join('') + '</div>';
}
var PLACE_TTL = 7*24*3600*1000;
function getPlace(){ try{ return localStorage.getItem('vp.place'); }catch(e){ return null; } }
function placeStale(){ try{ var t = +localStorage.getItem('vp.place_ts') || 0; return (Date.now() - t) > PLACE_TTL; }catch(e){ return false; } }
function refreshPlaceIfStale(){
  if (!getPlace() || placeIsManual() || !placeStale() || !navigator.permissions) return;
  navigator.permissions.query({ name: 'geolocation' }).then(function(st){
    if (st.state !== 'granted') return;             // never surprise-prompt
    var before = getPlace();
    detectPlace(function(p){ if (p && p !== before) renderVoteStrip(); });
  }).catch(function(){});
}
function osmLabel(ad){
  var city = ad.city || ad.town || ad.village || ad.municipality || ad.county || '';
  var region = ad.state || ad.province || ad.region || '';
  return [city, region, ad.country || ''].filter(Boolean).join(', ');
}
function savePlace(place, manual){
  try {
    localStorage.setItem('vp.place', place);
    localStorage.setItem('vp.place_ts', String(Date.now()));
    if (manual) localStorage.setItem('vp.place_manual', '1'); else localStorage.removeItem('vp.place_manual');
  } catch (e) {}
}
function placeIsManual(){ try { return localStorage.getItem('vp.place_manual') === '1'; } catch (e) { return false; } }
function detectPlace(cb){
  if (!navigator.geolocation) { cb(null); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=en&lat=' +
          pos.coords.latitude + '&lon=' + pos.coords.longitude)
      .then(function(r){ return r.json(); })
      .then(function(g){
        var place = osmLabel(g.address || {});
        if (!place) { cb(null); return; }
        savePlace(place, false);
        cb(place);
      }).catch(function(){ cb(null); });
  }, function(){ cb(null); }, { timeout: 8000 });
}
function afterPlaceChange(){
  _elCache = {};
  if (document.getElementById('votestrip')) renderVoteStrip();
  else if (location.pathname === '/pack') screenPack('local');
}
function changePlaceSheet(){
  var ov = document.createElement('div'); ov.className = 'stkover';
  document.body.appendChild(ov);
  function close(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.onclick = function(ev){ if (ev.target === ov) close(); };
  var cur = getPlace();
  ov.innerHTML = '<div class="stksheet">' +
    '<div class="q" style="font-size:17px; margin:0 0 4px">Where do you vote? 📍</div>' +
    '<p class="hint" style="text-align:left; margin:0 0 8px">' + (cur ? 'Now: <b>' + esc(cur) + '</b>. ' : '') +
      'Your elections and deadlines follow this place. Entries you already logged keep the place they were logged in.</p>' +
    '<div style="display:flex; gap:8px"><input id="plq" placeholder="Type a city, e.g. Burnaby" style="flex:1">' +
    '<button class="btn compact" id="plgo">Search</button></div>' +
    '<div id="plres"></div>' +
    '<button class="btn ghost" id="plgps">📍 Use my current location</button>' +
    '<button class="btn ghost" id="plclose">Close</button>' +
    '<p class="hint" style="font-size:11px">Search by © OpenStreetMap contributors</p></div>';
  document.getElementById('plclose').onclick = close;
  var busy = false;
  function search(){
    var q = document.getElementById('plq').value.trim(); if (!q || busy) return;
    busy = true; document.getElementById('plres').innerHTML = '<p class="hint">Searching…</p>';
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&accept-language=en&q=' + encodeURIComponent(q))
      .then(function(r){ return r.json(); })
      .then(function(rows){
        var seen = {}, out = [];
        (rows || []).forEach(function(r){ var l = osmLabel(r.address || {}); if (l && !seen[l]) { seen[l] = 1; out.push(l); } });
        var box = document.getElementById('plres');
        box.innerHTML = out.length ? out.map(function(l, i){ return '<button class="btn ghost" data-pl="' + i + '">' + esc(l) + '</button>'; }).join('')
                                   : '<p class="hint">No places found — try adding the province or country.</p>';
        Array.prototype.forEach.call(box.querySelectorAll('[data-pl]'), function(b){
          b.onclick = function(){ savePlace(out[+b.getAttribute('data-pl')], true); close(); afterPlaceChange(); };
        });
      }).catch(function(){ document.getElementById('plres').innerHTML = '<p class="hint">Search failed — try again.</p>'; })
      .then(function(){ busy = false; });
  }
  document.getElementById('plgo').onclick = search;
  document.getElementById('plq').onkeydown = function(ev){ if (ev.key === 'Enter') search(); };
  document.getElementById('plgps').onclick = function(){
    this.textContent = '📍 finding you…';
    detectPlace(function(){ close(); afterPlaceChange(); });
  };
}
document.addEventListener('click', function(ev){
  var t = ev.target && ev.target.closest ? ev.target.closest('.chgloc') : null;
  if (!t) return; ev.preventDefault(); changePlaceSheet();
});
var _noted = {};
function notePlace(place){
  if (!place) return Promise.resolve(null);
  if (!_noted[place]) _noted[place] = rpc('vp_note_place', { p_place: place }).catch(function(){ return null; });
  return _noted[place];
}
var _placePoll = null;
var OFFICE_WORD = { city: 'Local', province: 'State/Province', federal: 'National' };
function addOffices(el, place){
  rpc('vp_offices', { p_place: place }).then(function(list){
    if (!list || !list.length || getPlace() !== place) return;
    var html = '<div class="offices">🏛️ Your election offices: ' + list.map(function(o){
      return '<a href="' + esc(o.url) + '" target="_blank" rel="noopener">' + esc(o.label || OFFICE_WORD[o.level]) + ' ↗</a>';
    }).join('') + '</div>';
    var tries = 0;
    (function put(){
      if (el.querySelector('.offices')) return;
      if (el.firstChild) el.insertAdjacentHTML('beforeend', html);
      else if (++tries < 20) setTimeout(put, 150);
    })();
  }).catch(function(){});
}
function renderVoteStrip(){
  var el = document.getElementById('votestrip'); if (!el) return;
  var place = getPlace();
  if (!place) {
    el.innerHTML = '<div class="votestrip" style="display:flex;align-items:center;gap:8px">📍 <b>Find your next election</b><span class="days" id="findloc" style="cursor:pointer;margin-left:auto">use my location</span><a href="#" class="chgloc" style="font-size:12px;color:#3b6fb6;white-space:nowrap">or type a city</a></div>';
    document.getElementById('findloc').onclick = function(){
      el.innerHTML = '📍 sniffing around...';
      detectPlace(function(p){ renderVoteStrip(); });
    };
    return;
  }
  rpc('vp_upcoming', { p_place: place }).then(function(list){
    if (!list || !list.length) {
      var city = esc(place.split(',')[0]);
      var chg = ' <a href="#" class="chgloc" style="color:#3b6fb6;white-space:nowrap">change place</a>';
      el.innerHTML = '<div class="votestrip">🔎 Looking up votes in <b>' + city + '</b>…' + chg + '</div>';
      notePlace(place).then(function(s){
        if (getPlace() !== place || !document.getElementById('votestrip')) return;
        var st = s && s.status;
        if (st === 'checked') {
          el.innerHTML = '<div class="votestrip">🗳️ No upcoming votes found on official sources for <b>' + city + '</b>' +
            (s.last_checked ? ' (checked ' + new Date(s.last_checked).toLocaleDateString() + ')' : '') +
            '. Our pup rechecks regularly.' + chg + '</div>';
          addOffices(el, place);
          return;
        }
        el.innerHTML = '<div class="votestrip">🔎 First time we&rsquo;ve seen <b>' + city + '</b> — our pup is checking official sources now. ' +
          (st === 'busy' ? 'It&rsquo;s a busy day, so this may take a few hours.' : 'Usually a few minutes; this updates by itself.') + chg + '</div>';
        clearTimeout(_placePoll);
        var tries = 0;
        (function poll(){
          _placePoll = setTimeout(function(){
            if (getPlace() !== place || !document.getElementById('votestrip')) return;
            rpc('vp_upcoming', { p_place: place }).then(function(l2){
              if (l2 && l2.length) { renderVoteStrip(); return; }
              if (++tries < 12) { poll(); return; }
              delete _noted[place];
              renderVoteStrip();
            }).catch(function(){ if (++tries < 12) poll(); });
          }, 45000);
        })();
      });
      return;
    }
    notePlace(place);
    addOffices(el, place);
    mountMoments(el, list, true, 'When you can act · 📍 ' + esc(place.split(',')[0]) + ' · <a href="#" class="chgloc" style="color:#3b6fb6;text-transform:none">change</a>');
  }).catch(function(){ el.innerHTML = ''; });
}
var _elCache = {};
function fillEntryElections(){
  var chips = document.querySelectorAll('[data-eplace]');
  var byKey = {};
  Array.prototype.forEach.call(chips, function(c){
    var k = c.getAttribute('data-eplace') + '||' + (c.getAttribute('data-etopic') || '');
    (byKey[k] = byKey[k] || []).push(c);
  });
  Object.keys(byKey).forEach(function(k){
    var parts = k.split('||'), p = parts[0], t = parts[1] || null;
    var apply = function(e){
      byKey[k].forEach(function(c){
        var base = '📍 ' + esc(p.split(',')[0]);
        if (!e) { c.innerHTML = base; return; }
        var cls = e.kind === 'election' ? 'dred' : (e.kind === 'voice' ? 'dblue' : 'dgreen');
        c.innerHTML = base + ' · <span class="' + cls + '">🗳️ ' +
          (e.days === 0 ? 'today' : e.days + 'd') + '</span>';
        c.title = e.name;
      });
    };
    if (k in _elCache) { apply(_elCache[k]); return; }
    rpc('vp_find_moment', { p_place: p, p_topic: t }).then(function(e){ _elCache[k] = e; apply(e); }).catch(function(){});
  });
}

}
function pillClass(kind){ return kind === 'election' ? 'days red' : (kind === 'voice' ? 'days blue' : 'days'); }
function daysText(d){ return d === 0 ? 'TODAY' : 'in ' + d + ' day' + (d===1?'':'s'); }
function actionLinks(acts){
  return (acts || []).map(function(a){
    return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener noreferrer">↗ ' + esc(a.label) + '</a>';
  }).join('');
}

}

    '<span class="' + pillClass(e.kind) + '">' + daysText(e.days) + '</span></summary>' +
    '<div class="mombody">' + momentBody(e) + '</div></details>';
}
function groupedQuestionsRow(qs){
  var seen = {}, links = [];
  qs.forEach(function(q){ (q.actions || []).forEach(function(a){ if (!seen[a.url]) { seen[a.url] = 1; links.push(a); } }); });
  return '<details class="mom"><summary class="vsrow">🗳️ <b>' + qs.length + ' ballot question' + (qs.length===1?'':'s') + '</b>' +
    '<span class="days">' + daysText(qs[0].days) + '</span></summary>' +
    '<div class="mombody">' + qs.map(function(q){
      return '<div class="qname">' + esc(q.name) + '</div>' + (q.how ? '<div>' + esc(q.how) + '</div>' : '');
    }).join('') + '<div>' + actionLinks(links) + '</div></div></details>';
}
function shortDate(d){ return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }); }
function voiceItems(vs, cap){
  var shown = vs.slice(0, cap);
  return shown.map(function(v){
    var nm = v.name.replace(/^Have your say:\s*/, '');
    var link = v.source_url || (v.actions && v.actions[0] && v.actions[0].url) || '#';
    return '<div class="vitem"><a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">↗ ' + esc(nm) + '</a>' +
      ' <span>· closes ' + shortDate(v.vote_date) + '</span></div>';
  }).join('') + (vs.length > cap ? '<div class="vitem"><span>+ ' + (vs.length - cap) + ' more on Shape Your City</span></div>' : '');
}
function groupedVoiceRow(vs, cap){
  return '<details class="mom"><summary class="vsrow">🗣️ <b>' + (vs.length >= 40 ? '40+' : vs.length) + ' way' + (vs.length===1?'':'s') + ' to have your say</b>' +
    '<span class="days blue">next closes ' + daysText(vs[0].days) + '</span></summary>' +
    '<div class="mombody"><div>Anyone can comment — you don’t need to be a citizen or a voter.</div>' +
    voiceItems(vs, cap) + '</div></details>';
}
function momentTiles(list, groupDecisions){
  var items = [], byDate = {}, voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; items.push({ qd: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else items.push({ e: e });
  });
  var tiles = items.map(function(it){
    if (it.qd) {
      var qs = byDate[it.qd], seen = {}, links = [];
      qs.forEach(function(q){ (q.actions || []).forEach(function(a){ if (!seen[a.url]) { seen[a.url] = 1; links.push(a); } }); });
      return { cls: 'green', kind: 'Ballot questions', days: qs[0].days,
        title: qs.length + ' question' + (qs.length === 1 ? '' : 's') + ' on your ballot',
        body: qs.map(function(q){ return '<div class="qname">' + esc(q.name) + '</div>' + (q.how ? '<div>' + esc(q.how) + '</div>' : ''); }).join('') +
              '<div>' + actionLinks(links) + '</div>' };
    }
    var e = it.e;
    if (e.estimated) return { cls: 'red est', kind: 'Election · estimated', days: e.days, est: true, title: e.name,
      body: '<b>' + esc(e.name) + '</b>\n<i>Estimated: ' + esc(e.estimate_note || 'no date announced yet') +
            '. Official sources say when it&rsquo;s due, but no date is set yet. We&rsquo;ll replace this with the real date.</i>\n' + momentBody(e) };
    return { cls: e.kind === 'election' ? 'red' : (e.kind === 'voice' ? 'blue' : 'green'),
      kind: e.kind === 'election' ? 'Election' : (e.kind === 'voice' ? 'Have your say' : 'Ballot question'),
      days: e.days, title: e.name, body: '<b>' + esc(e.name) + '</b>\n' + momentBody(e) };
  });
  if (voice.length) tiles.push({ cls: 'blue', kind: 'Have your say', days: voice[0].days,
    title: (voice.length >= 40 ? '40+' : voice.length) + ' open consultation' + (voice.length === 1 ? '' : 's'),
    body: '<div>Anyone can comment — you don’t need to be a citizen or a voter.</div>' + voiceItems(voice, groupDecisions ? 8 : 12) });
  return tiles;
}

          : t.days === 0 ? 'TODAY' : t.days + '<small> day' + (t.days === 1 ? '' : 's') + '</small>') + '</div>' +
        '<div class="mn">' + esc(t.title) + '</div></div>';

function renderMoments(list, groupDecisions){
  var out = [], byDate = {}, order = [], voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; order.push({ q: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else order.push(e);
  });
  order.forEach(function(r){ out.push(r.q ? groupedQuestionsRow(byDate[r.q]) : momentRow(r)); });
  if (voice.length) out.push(groupedVoiceRow(voice, groupDecisions ? 6 : 10));
  return out.join('');
}

// sticker: 50x30mm-ish label PNG via canvas -> download / share
function renderSticker(name, url, cb){
  var W = 900, H = 540, c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#e8b84b'; x.lineWidth = 10; x.strokeRect(5, 5, W - 10, H - 10);
  var face = new Image(), qimg = new Image(), left = 2;
  function draw(){
    if (--left) return;
    x.save(); x.beginPath(); x.arc(110, 118, 70, 0, Math.PI * 2); x.clip();
    x.drawImage(face, 40, 48, 140, 140); x.restore();
    x.beginPath(); x.arc(110, 118, 70, 0, Math.PI * 2); x.lineWidth = 6; x.strokeStyle = '#e8b84b'; x.stroke();
    x.drawImage(qimg, W - 430, 60, 390, 390);
    x.fillStyle = '#2a2418';
    var fs = 58; do { x.font = '900 ' + fs + 'px sans-serif'; fs -= 2; } while (fs > 18 && x.measureText(name.toUpperCase()).width > 250);
    x.fillText(name.toUpperCase(), 200, 140);
    x.font = '600 32px sans-serif'; x.fillStyle = '#55677a';
    x.fillText('remembers what', 44, 270); x.fillText('you care about.', 44, 312);
    x.font = '600 24px sans-serif'; x.fillText('Scan to visit your pup →', 44, 380);
    x.font = '800 36px sans-serif'; x.fillStyle = '#2a2418'; x.fillText('voterpup.com', 44, 480);
    cb(c);
  }
  face.onload = draw; face.onerror = function(){ face = document.createElement('canvas'); draw(); };
  qimg.onload = draw;
  face.src = '/pup-face.jpg';
  qimg.src = qrDataURL(url, 8);
}

function sha256hex(str){

}

  root.innerHTML = nav() + '<div class="hint">Loading…</div>' + tabbar('manage'); wireTabs();
  readLedger(tail).then(function(L){
    if (!L) { root.innerHTML = nav() + say('This pup couldn&rsquo;t be found.', 'start a new one') + tabbar('manage'); wireTabs(); return; }
    var n = L.entries.length, nm = esc(L.name), backed = isBackedUp(tail);
    root.innerHTML = nav() +
      '<div class="q" style="font-size:20px; margin-bottom:10px">Manage ' + nm + ' 🐾</div>' +
      '<div class="mcard"><div class="mh">🔑 ' + nm + '&rsquo;s link</div>' +
        '<p class="mp">The only key to ' + nm + '. Anyone with it can read your entries, so keep it like a key.</p>' +
        '<div class="linkbox">' + esc(url) + '</div>' +
        '<div class="btnrow" style="margin-top:8px"><button class="btn ghost" id="mcopy">Copy link</button>' +
        '<button class="btn ghost" id="mstk">🏷️ Sticker</button></div></div>' +
      (GOOGLE_READY && !KIOSK ? '<div class="mcard"><div class="mh">🔐 Backup</div>' +
        (backed ? '<p class="mp">✅ ' + nm + ' is backed up to your Google account. Sign in on any device to bring it back.</p>'
                : '<p class="mp">Don&rsquo;t lose ' + nm + '. We use your email only to restore it on any device. No mail, ever.</p>' +
                  '<button class="btn gold" id="mbackup">Back up with Google</button><div id="mslot"></div>') +
        '</div>' : '') +
      (KIOSK ? '' : '<div class="mcard"><div class="mh">📤 Share my issues</div>' +
        '<p class="mp">A read-only code for candidates: they see what you need fixed, never your name or email.</p>' +
        '<button class="btn ghost" id="mshare"' + (n ? '' : ' disabled') + '>' + (n ? 'Open my share code' : 'Tell ' + nm + ' one issue first') + '</button></div>') +
      '<div class="mcard"><div class="mh">🐶 Pups</div>' +
        (GOOGLE_READY && !KIOSK ? '<button class="btn ghost" id="mpups">My backed-up pups</button><div id="mrslot"></div>' : '') +
        '<button class="btn ghost" id="mnew">＋ Start another pup</button></div>' +
      '<footer><a href="/privacy.html">Privacy</a> · <a href="mailto:hi@voterpup.com">hi@voterpup.com</a></footer>' +
      tabbar('manage');
    wireTabs();
    document.getElementById('mcopy').onclick = function(){
      var b = this; navigator.clipboard.writeText(url).then(function(){ b.textContent = 'Copied ✓'; });
    };
    document.getElementById('mstk').onclick = function(){ makeSticker(L.name, url); };
    var mb = document.getElementById('mbackup');
    if (mb) mb.onclick = function(){
      mb.style.display = 'none';
      sb.auth.getSession().then(function(r){
        if (r.data && r.data.session) {
          sb.rpc('vp_claim_ledger', { p_tail: tail }).then(function(x){ if (x.error) throw new Error(x.error.message); markBackedUp(tail); screenManage(); })
            .catch(function(e){ mb.style.display = ''; alert('Backup didn\u2019t finish: ' + e.message); });
        } else startBackup(tail, document.getElementById('mslot'), screenManage);
      });
    };
    var ms = document.getElementById('mshare');
    if (ms && n) ms.onclick = function(){ showCandidate(tail, L.name); };
    var mp = document.getElementById('mpups');
    if (mp) mp.onclick = function(){ mp.style.display = 'none'; startRestore(document.getElementById('mrslot')); };
    document.getElementById('mnew').onclick = function(){ location.href = '/app.html?new=1'; };
  }).catch(function(e){ root.innerHTML = nav() + say('Couldn&rsquo;t load this.', esc(e.message)) + tabbar('manage'); wireTabs(); });
}

// ---------- router ----------
(function(){
  var m = location.pathname.match(/^\/p\/(.+)$/);
  var qs = new URLSearchParams(location.search);
  var vm = location.pathname.match(/^\/v\/([0-9a-f]{20})$/);
  if (vm) screenView(vm[1]);
  else if (m) screenLedger(decodeURIComponent(m[1]));
  else if (location.pathname === '/pack') screenPack(undefined, new URLSearchParams(location.search).get('t') || null);
  else if (location.pathname === '/manage') screenManage();
  else screenCapture();
})();
</script>

</script>
<script data-goatcounter="https://voterpup.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
