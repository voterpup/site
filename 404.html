<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoterPup — your pup remembers</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root{ --bg:#f6f8fa; --card:#ffffff; --ink:#212b36; --sub:#5b6b7c;
         --accent:#2f7d5f; --gold:#e8b84b; --goldink:#2a2418; --line:#e3e9ee; --chip:#eef2f5; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:max(18px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom));
       display:flex; justify-content:center}
  .wrap{width:100%; max-width:560px}
  .brand{color:var(--gold); font-size:21px; font-weight:800; margin-bottom:12px}
  .q{font-size:23px; font-weight:700; line-height:1.32; margin:4px 0 10px}
  .hint{color:var(--sub); font-size:13px; margin:0 0 12px}
  textarea,input{width:100%; background:var(--chip); color:var(--ink); border:1px solid var(--line);
       border-radius:12px; padding:13px; font-size:16px}
  textarea{min-height:80px; resize:vertical}
  .btn{display:block; width:100%; background:var(--accent); color:#eaf5ef; border:0; border-radius:12px;
       padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer; margin-top:12px}
  .btn.gold{background:var(--gold); color:var(--goldink)}
  .btn.ghost{background:var(--chip); color:var(--sub); border:1px solid var(--line)}
  .btn:disabled{opacity:.45}
  .btnrow{display:flex; gap:8px}
  .btnrow .btn{flex:1}
  .sub{font-size:11px; opacity:.75; font-weight:400; margin-top:2px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .chip{background:var(--chip); border:1px solid var(--line); color:var(--sub); border-radius:999px;
        padding:6px 12px; font-size:12.5px; cursor:pointer}
  .chip.goldline{border-color:var(--gold); color:var(--gold)}
  .chip.goldfill{background:#faf3df; border-color:var(--gold); color:var(--gold); font-weight:700; cursor:default}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px}
  .privacy{color:var(--sub); font-size:12.5px; margin:12px 0 2px}
  .entry-body{font-size:15px}
  .ts{color:#7d8da0; font-size:11.5px; margin-top:5px}
  .count{color:var(--sub); font-size:13px; margin:14px 0}
  /* ceremony — squash & stretch, staged */
  .scene{height:250px; display:flex; align-items:flex-end; justify-content:center; position:relative; margin:20px 0 4px}
  .gift{font-size:82px; z-index:2; transform-origin:50% 90%;
        animation: giftshake .9s ease-in-out 1, giftpop .3s ease-in 1.0s forwards}
  @keyframes giftshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(7deg)}
        45%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
  @keyframes giftpop{60%{transform:scale(1.25); opacity:.7}100%{transform:scale(1.7); opacity:0}}
  .paw{position:absolute; bottom:84px; left:50%; font-size:20px; opacity:0; z-index:1}
  .p1{animation:pawfly .85s ease-out 1.02s forwards} .p2{animation:pawfly2 .9s ease-out 1.05s forwards}
  .p3{animation:pawfly3 .8s ease-out 1.08s forwards} .p4{animation:pawfly4 .95s ease-out 1.03s forwards}
  .p5{animation:pawfly5 .85s ease-out 1.07s forwards}
  @keyframes pawfly {10%{opacity:1}100%{opacity:0; transform:translate(-90px,-120px) rotate(-40deg)}}
  @keyframes pawfly2{10%{opacity:1}100%{opacity:0; transform:translate(70px,-140px) rotate(35deg)}}
  @keyframes pawfly3{10%{opacity:1}100%{opacity:0; transform:translate(-40px,-160px) rotate(-15deg)}}
  @keyframes pawfly4{10%{opacity:1}100%{opacity:0; transform:translate(110px,-90px) rotate(50deg)}}
  @keyframes pawfly5{10%{opacity:1}100%{opacity:0; transform:translate(10px,-175px) rotate(10deg)}}
  .pupimg{width:84px; height:84px; border-radius:50%; object-fit:cover; object-position:55% 45%;
          border:3px solid var(--gold); box-shadow:0 6px 18px rgba(232,184,75,.35);
          position:absolute; bottom:40px; opacity:0; transform-origin:50% 100%;
          animation: puprise 1.05s cubic-bezier(.22,1,.36,1) 1.1s forwards}
  @keyframes puprise{0%{opacity:0; transform:translateY(95px) scale(.25)}
        45%{opacity:1; transform:translateY(-16px) scale(1.06)}
        62%{transform:translateY(0) scale(1.14,.86)}
        78%{transform:translateY(-5px) scale(.94,1.06)}
        90%{transform:translateY(0) scale(1.04,.97)}
        100%{opacity:1; transform:translateY(0) scale(1)}}
  .cap{font-size:34px; position:absolute; bottom:106px; margin-left:-10px; z-index:3; opacity:0; transform-origin:50% 100%;
       animation: capdrop .55s cubic-bezier(.34,1.56,.64,1) 2.25s forwards}
  @keyframes capdrop{0%{opacity:0; transform:translateY(-130px) rotate(20deg)}
        70%{opacity:1; transform:translateY(4px) rotate(-16deg)}
        100%{opacity:1; transform:translateY(0) rotate(-14deg)}}
  .tag{position:absolute; bottom:14px; background:var(--gold); color:var(--goldink); font-weight:900;
       letter-spacing:1px; font-size:13px; border-radius:8px; padding:3px 10px; opacity:0; z-index:4;
       box-shadow:0 2px 8px rgba(232,184,75,.4);
       animation:pop .45s cubic-bezier(.34,1.56,.64,1) 2.7s forwards}
  @keyframes pop{0%{opacity:0; transform:scale(0) rotate(-6deg)}70%{opacity:1; transform:scale(1.15) rotate(2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  .ready{opacity:0; animation:fadein .4s ease 3.1s forwards; text-align:center}
  @keyframes fadein{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .pupimg,.cap,.tag,.ready,.paw{animation:none; opacity:1}
        .gift{animation:none; opacity:0} .paw{display:none} }
  .pulse{animation:pulsebtn 1.25s ease-in-out infinite}
  @keyframes pulsebtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04); box-shadow:0 5px 18px rgba(232,184,75,.5)}}
  .reveal{opacity:0; transition:opacity .5s ease}
  .reveal.show{opacity:1}
  .namefield{margin-top:10px}
  .unboxwrap{position:relative; width:100%; max-width:300px; margin:8px auto 4px; border-radius:18px; overflow:hidden;
      aspect-ratio:9/16; max-height:58vh; background:#e9edf1; box-shadow:0 6px 24px rgba(16,24,40,.12)}
  .unboxwrap video{width:100%; height:100%; object-fit:cover; display:block}
  .unboxwrap .tag{bottom:14px; left:50%; transform:translateX(-50%) scale(0)}
  @keyframes poptag{0%{opacity:0; transform:translateX(-50%) scale(0)}70%{opacity:1; transform:translateX(-50%) scale(1.15)}100%{opacity:1; transform:translateX(-50%) scale(1)}}
  .unboxwrap .tag{animation:poptag .45s cubic-bezier(.34,1.56,.64,1) 3.1s forwards}
  .fetchcard{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:8px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .fetchcard video{width:78px; height:120px; object-fit:cover; border-radius:12px; flex:0 0 auto; background:#e9edf1}
  .fetchcard .ft{font-size:14px; font-weight:700; line-height:1.35}
  .fetchcard .ft small{display:block; font-weight:500; color:var(--sub); font-size:12px; margin-top:3px}
  .linkbox{background:var(--chip); border:1px dashed var(--gold); border-radius:12px; padding:12px;
           font-size:13px; word-break:break-all; margin-top:10px}
  .qrwrap{display:flex; justify-content:center; margin:14px 0}
  .qrwrap img{border-radius:10px; background:#fff; padding:10px}
  .kioskqr img{width:78vw; max-width:420px}
  .banner{background:var(--chip); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
          color:var(--sub); font-size:13px; margin-top:14px}
  footer{text-align:center; color:var(--sub); font-size:12.5px; margin-top:24px}
  footer a{color:var(--sub)}
  .nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px}
  .nav .brand{margin:0}
  .nav a{color:var(--gold); font-size:13.5px; font-weight:700; text-decoration:none}
  .packtag{color:var(--sub); font-size:13px; margin:2px 0 12px}
  .searchbar{width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:11px 13px; font-size:15px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .tilegrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .tile{border-radius:14px; color:#fff; padding:12px; min-height:118px; position:relative; overflow:hidden;
      cursor:pointer; display:flex; flex-direction:column; justify-content:flex-end;
      background-size:cover; background-position:center; box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .tile .tcount{position:absolute; top:8px; right:11px; font-weight:900; font-size:19px; opacity:.95}
  .tile .tname{font-weight:800; font-size:13px; letter-spacing:.3px; margin-top:6px}
  .tile .tsnippet{font-size:12.5px; line-height:1.35; opacity:.95; min-height:34px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
      transition:opacity .45s}
  .tile.mine{color:var(--goldink)}
  .tile .tbg{position:absolute; inset:0; background-size:cover; background-position:center; transition:opacity .7s ease}
  .tile .tcount,.tile .tsnippet,.tile .tname{position:relative; z-index:1}
  .tile .tcount{position:absolute}
  .mombody .vitem{margin-top:6px}
  .mombody .vitem a{margin:0; font-weight:700}
  .mombody .vitem span{color:var(--sub)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start}
  .grid2 .card{margin-top:0}
  .grid2 .entry-body{font-size:13.5px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
  .grid2 .media img,.grid2 .media video{max-height:110px}
  .grid2 .chips{gap:5px}
  .grid2 .chip{padding:4px 8px; font-size:10.5px}
  .grid2 .ts{font-size:10.5px}
  .backchip{margin-bottom:10px; display:inline-block}
  .tabbar{position:fixed; left:0; right:0; bottom:0; display:flex; z-index:9;
          background:var(--card); border-top:1px solid var(--line);
          padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1; text-align:center; padding:9px 0 7px; text-decoration:none;
          color:var(--sub); font-size:19px; line-height:1.1}
  .tabbar a span{display:block; font-size:11px; font-weight:700; margin-top:1px}
  .tabbar a.on{color:var(--accent)}
  .attach{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .attach .th{position:relative}
  .attach img,.attach video{width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line)}
  .attach .rm{position:absolute; top:-6px; right:-6px; background:var(--ink); color:var(--card);
          border-radius:50%; width:20px; height:20px; font-size:12px; line-height:20px; text-align:center; cursor:pointer}
  .media img,.media video{width:100%; border-radius:10px; margin-top:8px; max-height:340px; object-fit:cover; background:#000}
  .appstrip{background:#faf3df; border:1px solid var(--gold); color:#8a6a14; border-radius:10px;
      font-size:11.5px; font-weight:700; padding:5px 10px; text-align:center; margin-bottom:10px}
  .votestrip{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px;
      font-size:12.5px; color:var(--sub); margin-bottom:10px; display:block;
      box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .votestrip b{color:var(--ink)}
  .vsrow{display:flex; align-items:center; gap:8px; padding:2.5px 0}
  .votestrip .days{margin-left:auto; background:var(--accent); color:#f2f9f5; border-radius:999px;
      padding:3px 10px; font-weight:800; font-size:12px; white-space:nowrap}
  .votestrip .days.red{background:#a94b4b}
  .dred{color:#a94b4b; font-weight:800}
  .dgreen{color:var(--accent); font-weight:800}
  .votestrip .days.blue{background:#3b6fb6}
  .dblue{color:#3b6fb6; font-weight:800}
  details.mom{border-top:1px solid var(--line)}
  details.mom:first-child{border-top:0}
  details.mom summary{list-style:none; cursor:pointer}
  details.mom summary::-webkit-details-marker{display:none}
  .mombody{padding:4px 0 8px 22px; font-size:12.5px; color:var(--sub); white-space:pre-line}
  .mombody a{display:inline-block; margin:4px 8px 0 0; color:#3b6fb6; font-weight:700; text-decoration:none}
  .mombody .qname{color:var(--ink); font-weight:700; margin-top:6px}
  .topicchip{background:#eef6f2; border:1px solid #cfe5da; color:#2f7d5f; border-radius:999px;
      padding:4px 10px; font-size:11.5px; font-weight:700; text-decoration:none; display:inline-block; cursor:pointer}
  .say{display:flex; gap:10px; align-items:flex-start; margin:2px 0 12px}
  .avatar{width:32px; height:32px; border-radius:50%; object-fit:cover; object-position:55% 45%;
          border:2px solid var(--gold); flex:0 0 auto}
  .balloon{background:var(--card); border:1px solid var(--line); border-radius:4px 16px 16px 16px;
          padding:9px 13px; font-size:14.5px; font-weight:600; line-height:1.4;
          box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .balloon small{display:block; font-weight:500; color:var(--sub); font-size:12px; margin-top:3px}
  .composer{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px;
          box-shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06)}
  .composer textarea{width:100%; border:0; outline:0; resize:vertical; background:transparent;
          color:var(--ink); font:16px/1.5 inherit; min-height:60px; padding:2px}
  .cfoot{display:flex; align-items:flex-end; gap:8px; margin-top:8px}
  .iconbtn{width:38px; height:38px; border-radius:12px; background:var(--chip); border:1px solid var(--line);
          font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto}
  .spacer{flex:1}
  .btn.compact{display:inline-block; width:auto; margin:0; padding:10px 14px; border-radius:11px; font-size:13.5px}
  [hidden]{display:none!important}
  .center{text-align:center}
</style>
</head>

<script>
// ===== CONFIG — paste from Supabase project settings (API section) =====
var SUPABASE_URL = "https://setyjmgijsbplgyqynlh.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldHlqbWdpanNicGxneXF5bmxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDU0NTAsImV4cCI6MjEwNjEyMTQ1MH0.v8tjuc2UZrTw5whfDXtpEPW4CHggusgjq8Mkdh6ZMw8";
// ======================================================================

var BASE = location.origin;
var KIOSK = new URLSearchParams(location.search).get('kiosk') === '1';
var root = document.getElementById('root');

function rpc(fn, args) {
  return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY,
               'Authorization': 'Bearer ' + SUPABASE_ANON_KEY },
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.text().then(function (t) {
      if (!r.ok) throw new Error(t);
      return t ? JSON.parse(t) : null;
    });
  });
}

function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function qrDataURL(text, cell){ var q=qrcode(0,'M'); q.addData(text); q.make(); return q.createDataURL(cell||6, 2); }
var pendingFiles = [];
function attachRow_unused(){
  return '<div class="attach"><button class="chip" id="addmedia" type="button">📷 add photos / video</button>' +
         '<input id="fpick" type="file" accept="image/*,video/*" multiple hidden><div id="thumbs" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>';
}
function wireAttach(){
  var pick = document.getElementById('fpick');
  document.getElementById('addmedia').onclick = function(){ pick.click(); };
  pick.onchange = function(){
    Array.prototype.forEach.call(pick.files, function(f){
      if (pendingFiles.length >= 4) return;
      if (f.size > 25*1024*1024) { alert(f.name + ' is over 25MB'); return; }
      pendingFiles.push(f);
    });
    pick.value = ''; renderThumbs();
  };
}
function renderThumbs(){
  var t = document.getElementById('thumbs'); if (!t) return;
  t.innerHTML = pendingFiles.map(function(f, i){
    var u = URL.createObjectURL(f);
    var el = f.type.indexOf('video') === 0
      ? '<video src="' + u + '" muted></video>' : '<img src="' + u + '">';
    return '<span class="th">' + el + '<span class="rm" data-i="' + i + '">×</span></span>';
  }).join('');
  Array.prototype.forEach.call(t.querySelectorAll('.rm'), function(r){
    r.onclick = function(){ pendingFiles.splice(+r.getAttribute('data-i'), 1); renderThumbs(); };
  });
}
function uploadPending(){
  var ups = pendingFiles.map(function(f){
    var ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);
    var name = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random())) + '.' + ext;
    return fetch(SUPABASE_URL + '/storage/v1/object/media/' + name, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                 'Content-Type': f.type || 'application/octet-stream' },
      body: f
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(t); });
      return { url: SUPABASE_URL + '/storage/v1/object/public/media/' + name, type: f.type };
    });
  });
  return Promise.all(ups);
}
function mediaHTML(m){
  if (!m || !m.length) return '';
  return '<div class="media">' + m.map(function(x){
    return x.type && x.type.indexOf('video') === 0
      ? '<video src="' + esc(x.url) + '" controls playsinline preload="metadata"></video>'
      : '<img src="' + esc(x.url) + '" loading="lazy">';
  }).join('') + '</div>';
}
var PLACE_TTL = 7*24*3600*1000;
function getPlace(){ try{ return localStorage.getItem('vp.place'); }catch(e){ return null; } }
function placeStale(){ try{ var t = +localStorage.getItem('vp.place_ts') || 0; return (Date.now() - t) > PLACE_TTL; }catch(e){ return false; } }
function refreshPlaceIfStale(){
  if (!getPlace() || !placeStale() || !navigator.permissions) return;
  navigator.permissions.query({ name: 'geolocation' }).then(function(st){
    if (st.state !== 'granted') return;             // never surprise-prompt
    var before = getPlace();
    detectPlace(function(p){ if (p && p !== before) renderVoteStrip(); });
  }).catch(function(){});
}
function detectPlace(cb){
  if (!navigator.geolocation) { cb(null); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + pos.coords.latitude +
          '&longitude=' + pos.coords.longitude + '&localityLanguage=en')
      .then(function(r){ return r.json(); })
      .then(function(g){
        var rawCity = (g.city || g.locality || '');
        var city = rawCity.replace(/\b(Metro|Greater|Regional District|District of|City of)\b/gi, '').replace(/\s+/g,' ').trim() || rawCity;
        var place = [city, g.principalSubdivision, g.countryName].filter(Boolean).join(', ');
        try{ localStorage.setItem('vp.place', place); localStorage.setItem('vp.place_ts', String(Date.now())); }catch(e){}
        cb(place);
      }).catch(function(){ cb(null); });
  }, function(){ cb(null); }, { timeout: 8000 });
}
function renderVoteStrip(){
  var el = document.getElementById('votestrip'); if (!el) return;
  var place = getPlace();
  if (!place) {
    el.innerHTML = '📍 <b>Find your next election</b><span class="days" id="findloc" style="cursor:pointer">use my location</span>';
    document.getElementById('findloc').onclick = function(){
      el.innerHTML = '📍 sniffing around...';
      detectPlace(function(p){ renderVoteStrip(); });
    };
    return;
  }
  rpc('vp_upcoming', { p_place: place }).then(function(list){
    if (!list || !list.length) { el.innerHTML = '🗳️ No upcoming votes on file for <b>' + esc(place.split(',')[0]) + '</b> yet.'; return; }
    el.innerHTML = renderMoments(list, true);
  }).catch(function(){ el.innerHTML = ''; });
}
var _elCache = {};
function fillEntryElections(){
  var chips = document.querySelectorAll('[data-eplace]');
  var byKey = {};
  Array.prototype.forEach.call(chips, function(c){
    var k = c.getAttribute('data-eplace') + '||' + (c.getAttribute('data-etopic') || '');
    (byKey[k] = byKey[k] || []).push(c);
  });
  Object.keys(byKey).forEach(function(k){
    var parts = k.split('||'), p = parts[0], t = parts[1] || null;
    var apply = function(e){
      byKey[k].forEach(function(c){
        var base = '📍 ' + esc(p.split(',')[0]);
        if (!e) { c.innerHTML = base; return; }
        var cls = e.kind === 'election' ? 'dred' : (e.kind === 'voice' ? 'dblue' : 'dgreen');
        c.innerHTML = base + ' · <span class="' + cls + '">🗳️ ' +
          (e.days === 0 ? 'today' : e.days + 'd') + '</span>';
        c.title = e.name;
      });
    };
    if (k in _elCache) { apply(_elCache[k]); return; }

function renderMoments(list, groupDecisions){
  var out = [], byDate = {}, order = [], voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; order.push({ q: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else order.push(e);
  });
  order.forEach(function(r){ out.push(r.q ? groupedQuestionsRow(byDate[r.q]) : momentRow(r)); });
  if (voice.length) out.push(groupedVoiceRow(voice, groupDecisions ? 6 : 10));

}

function makeSticker(name, url){
  var W = 900, H = 540, c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,W,H);
  var qimg = new Image();
  qimg.onload = function(){
    x.drawImage(qimg, W-440, 50, 400, 400);
    x.fillStyle = '#2a2418';
    x.font = '900 64px sans-serif'; x.fillText('🐾 ' + name.toUpperCase(), 40, 140);
    x.font = '600 34px sans-serif'; x.fillStyle = '#55677a';
    x.fillText('remembers what', 40, 230); x.fillText('you care about.', 40, 275);
    x.font = '800 36px sans-serif'; x.fillStyle = '#2a2418';
    x.fillText('voterpup.com', 40, 470);
    c.toBlob(function(blob){
      var f = new File([blob], 'voterpup-' + name.toLowerCase() + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: 'VoterPup sticker' }).catch(function(){});
      } else {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
      }
    });
  };
  qimg.src = qrDataURL(url, 8);
}

      var out = [];
      list.forEach(function(r){ (r.media || []).forEach(function(m){
        if (m.type && m.type.indexOf('image') === 0 && out.indexOf(m.url) < 0) out.push(m.url);
      }); });
      return out;
    }
    var GRAD = 'linear-gradient(rgba(20,26,33,.25), rgba(20,26,33,.72))';
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function tilesView(){
      clearInterval(window._packT);
      var imgsByTile = tiles.map(function(t){ return tileImgs(t.list); });
      imgsByTile.forEach(function(arr){ arr.forEach(function(u){ var im = new Image(); im.src = u; }); });
      b.innerHTML = '<div class="tilegrid">' + tiles.map(function(t, i){
        var imgs = imgsByTile[i];
        var bgStyle = imgs.length
          ? 'background-image:' + GRAD + ', url(' + esc(imgs[0]) + ')'
          : 'background:' + t.color;
        return '<div class="tile' + (t.mine ? ' mine' : '') + '" data-i="' + i + '" style="background:' + t.color + '">' +
          '<div class="tbg" id="tbg' + i + '" style="' + bgStyle + '"></div>' +
          '<div class="tcount">' + t.list.length + '</div>' +
          '<div class="tsnippet" id="tsnip' + i + '">' + esc((t.list[0].body || '📷').slice(0, 90)) + '</div>' +
          '<div class="tname">' + esc(t.name) + '</div></div>';
      }).join('') + '</div>';
      Array.prototype.forEach.call(b.querySelectorAll('.tile'), function(el){
        el.onclick = function(){ feedView(tiles[+el.getAttribute('data-i')]); };
      });
      if (reduceMotion) return;
      var tick = 0;
      window._packT = setInterval(function(){
        tick++;
        tiles.forEach(function(t, i){
          if (t.list.length > 1) {
            var sn = document.getElementById('tsnip' + i);
            if (sn) {
              sn.style.opacity = 0;
              setTimeout(function(){
                var r = t.list[tick % t.list.length];
                sn.textContent = (r.body || '📷').slice(0, 90);
                sn.style.opacity = 1;
              }, 450);
            }
          }
          var imgs = imgsByTile[i];
          if (imgs.length > 1) {
            var bg = document.getElementById('tbg' + i);
            if (bg) {
              bg.style.opacity = 0;
              setTimeout(function(){
                bg.style.backgroundImage = GRAD + ', url(' + imgs[tick % imgs.length] + ')';
                bg.style.opacity = 1;
              }, 700);
            }
          }
        });
      }, 3500);
    }

    function feedView(t){
      clearInterval(window._packT);
      b.innerHTML = '<span class="chip goldline backchip" id="back">\u2190 all tiles</span>' +
        '<div class="count" style="margin-top:0">' + esc(t.name) + ' \u00b7 ' + t.list.length + '</div>' +
        '<div id="tmoments"></div>' +
        feedHTML(t.list);
      document.getElementById('back').onclick = tilesView;
      if (!t.mine) topicMoments(t, function(html){
        var tm = document.getElementById('tmoments'); if (tm) tm.innerHTML = html;
      });
    }

    if (topic0) {
      var hit0 = null;
      tiles.forEach(function(t){ if (t.key === topic0) hit0 = t; });
      if (hit0) { feedView(hit0); return; }
    }

    var all = rows.slice();
    mine.forEach(function(m){ if (!all.some(function(r){ return r.ts === m.ts && r.pup === m.pup; })) all.push(m); });
    document.getElementById('packsearch').oninput = function(){
      var q = this.value.trim().toLowerCase();
      if (!q) { tilesView(); return; }
      clearInterval(window._packT);
      var hit = all.filter(function(r){
        return (r.body || '').toLowerCase().indexOf(q) >= 0 ||
               (r.topic || '').toLowerCase().indexOf(q) >= 0 ||
               (r.pup || '').toLowerCase().indexOf(q) >= 0 ||
               (r.place || '').toLowerCase().indexOf(q) >= 0;
      });
      b.innerHTML = hit.length ? feedHTML(hit) : '<div class="hint">Nothing in the pack matches that. \ud83d\udc3e</div>';
    };

    tilesView();
  }).catch(function(e){ document.getElementById('board').textContent = 'The pack is napping: ' + e.message; });
}

  var m = location.pathname.match(/^\/p\/(.+)$/);
  if (m) screenLedger(decodeURIComponent(m[1]));
  else if (location.pathname === '/pack') screenPack(undefined, new URLSearchParams(location.search).get('t') || null);
  else screenCapture();
})();
