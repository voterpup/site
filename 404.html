<style>
  :root{ --bg:#f6f8fa; --card:#ffffff; --ink:#212b36; --sub:#5b6b7c;
         --accent:#2f7d5f; --gold:#e8b84b; --goldink:#2a2418; --line:#e3e9ee; --chip:#eef2f5; }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:max(18px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom));
       display:flex; justify-content:center}
  .wrap{width:100%; max-width:560px}
  .brand{color:var(--gold); font-size:21px; font-weight:800; margin-bottom:12px}
  .q{font-size:23px; font-weight:700; line-height:1.32; margin:4px 0 10px}
  .hint{color:var(--sub); font-size:13px; margin:0 0 12px}
  textarea,input{width:100%; background:var(--chip); color:var(--ink); border:1px solid var(--line);
       border-radius:12px; padding:13px; font-size:16px}
  textarea{min-height:80px; resize:vertical}
  .btn{display:block; width:100%; background:var(--accent); color:#eaf5ef; border:0; border-radius:12px;
       padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer; margin-top:12px}
  .btn.gold{background:var(--gold); color:var(--goldink)}
  .btn.ghost{background:var(--chip); color:var(--sub); border:1px solid var(--line)}
  .btn:disabled{opacity:.45}
  .btnrow{display:flex; gap:8px}
  .btnrow .btn{flex:1}
  .sub{font-size:11px; opacity:.75; font-weight:400; margin-top:2px}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .chip{background:var(--chip); border:1px solid var(--line); color:var(--sub); border-radius:999px;
        padding:6px 12px; font-size:12.5px; cursor:pointer}
  .chip.goldline{border-color:var(--gold); color:var(--gold)}
  .chip.same{border-color:#d9c38a; color:#8a6a14; background:#fff; font-weight:700; cursor:pointer}
  .chip.same.on{background:#faf3df; border-color:var(--gold); color:#7a5a0c}
  .chip.same.static{cursor:default}
  .chip.goldfill{background:#faf3df; border-color:var(--gold); color:var(--gold); font-weight:700; cursor:default}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:10px}
  .privacy{color:var(--sub); font-size:12.5px; margin:12px 0 2px}
  .entry-body{font-size:15px}
  .ts{color:#7d8da0; font-size:11.5px; margin-top:5px}
  .count{color:var(--sub); font-size:13px; margin:14px 0}
  /* ceremony — squash & stretch, staged */
  .scene{height:250px; display:flex; align-items:flex-end; justify-content:center; position:relative; margin:20px 0 4px}
  .gift{font-size:82px; z-index:2; transform-origin:50% 90%;
        animation: giftshake .9s ease-in-out 1, giftpop .3s ease-in 1.0s forwards}
  @keyframes giftshake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(7deg)}
        45%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
  @keyframes giftpop{60%{transform:scale(1.25); opacity:.7}100%{transform:scale(1.7); opacity:0}}
  .paw{position:absolute; bottom:84px; left:50%; font-size:20px; opacity:0; z-index:1}
  .p1{animation:pawfly .85s ease-out 1.02s forwards} .p2{animation:pawfly2 .9s ease-out 1.05s forwards}
  .p3{animation:pawfly3 .8s ease-out 1.08s forwards} .p4{animation:pawfly4 .95s ease-out 1.03s forwards}
  .p5{animation:pawfly5 .85s ease-out 1.07s forwards}
  @keyframes pawfly {10%{opacity:1}100%{opacity:0; transform:translate(-90px,-120px) rotate(-40deg)}}
  @keyframes pawfly2{10%{opacity:1}100%{opacity:0; transform:translate(70px,-140px) rotate(35deg)}}
  @keyframes pawfly3{10%{opacity:1}100%{opacity:0; transform:translate(-40px,-160px) rotate(-15deg)}}
  @keyframes pawfly4{10%{opacity:1}100%{opacity:0; transform:translate(110px,-90px) rotate(50deg)}}
  @keyframes pawfly5{10%{opacity:1}100%{opacity:0; transform:translate(10px,-175px) rotate(10deg)}}
  .pupimg{width:84px; height:84px; border-radius:50%; object-fit:cover; object-position:55% 45%;
          border:3px solid var(--gold); box-shadow:0 6px 18px rgba(232,184,75,.35);
          position:absolute; bottom:40px; opacity:0; transform-origin:50% 100%;
          animation: puprise 1.05s cubic-bezier(.22,1,.36,1) 1.1s forwards}
  @keyframes puprise{0%{opacity:0; transform:translateY(95px) scale(.25)}
        45%{opacity:1; transform:translateY(-16px) scale(1.06)}
        62%{transform:translateY(0) scale(1.14,.86)}
        78%{transform:translateY(-5px) scale(.94,1.06)}
        90%{transform:translateY(0) scale(1.04,.97)}
        100%{opacity:1; transform:translateY(0) scale(1)}}
  .cap{font-size:34px; position:absolute; bottom:106px; margin-left:-10px; z-index:3; opacity:0; transform-origin:50% 100%;
       animation: capdrop .55s cubic-bezier(.34,1.56,.64,1) 2.25s forwards}
  @keyframes capdrop{0%{opacity:0; transform:translateY(-130px) rotate(20deg)}

  .tag{position:absolute; bottom:14px; background:var(--gold); color:var(--goldink); font-weight:900;
       letter-spacing:1px; font-size:13px; border-radius:8px; padding:3px 10px; opacity:0; z-index:4;
       box-shadow:0 2px 8px rgba(232,184,75,.4);
       animation:pop .45s cubic-bezier(.34,1.56,.64,1) 2.7s forwards}
  @keyframes pop{0%{opacity:0; transform:scale(0) rotate(-6deg)}70%{opacity:1; transform:scale(1.15) rotate(2deg)}100%{opacity:1; transform:scale(1) rotate(0)}}
  .ready{opacity:0; animation:fadein .4s ease 3.1s forwards; text-align:center}
  @keyframes fadein{to{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .pupimg,.cap,.tag,.ready,.paw{animation:none; opacity:1}
        .gift{animation:none; opacity:0} .paw{display:none} }
  .pulse{animation:pulsebtn 1.25s ease-in-out infinite}
  @keyframes pulsebtn{0%,100%{transform:scale(1)}50%{transform:scale(1.04); box-shadow:0 5px 18px rgba(232,184,75,.5)}}
  .reveal{opacity:0; transition:opacity .5s ease}
  .reveal.show{opacity:1}
  .namefield{margin-top:10px}

  .unboxwrap video{width:100%; height:100%; object-fit:cover; display:block}

  @keyframes poptag{0%{opacity:0; transform:translateX(-50%) scale(0)}70%{opacity:1; transform:translateX(-50%) scale(1.15)}100%{opacity:1; transform:translateX(-50%) scale(1)}}
  .unboxwrap .tag{animation:poptag .45s cubic-bezier(.34,1.56,.64,1) 3.1s forwards}
  .fetchcard{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:8px; margin:0 0 12px; box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .fetchcard video{width:78px; height:120px; object-fit:cover; border-radius:12px; flex:0 0 auto; background:#e9edf1}
  .fetchcard .ft{font-size:14px; font-weight:700; line-height:1.35}
  .fetchcard .ft small{display:block; font-weight:500; color:var(--sub); font-size:12px; margin-top:3px}
  .fetchvid{position:relative; width:78px; height:120px; flex:0 0 auto}

  .fetchvid .vtop{z-index:2; transition:opacity .35s}
  .fetchvid img.vsit{position:absolute; inset:0; width:78px; height:120px; object-fit:cover; border-radius:12px; background:#e9edf1}
  .mcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin:0 0 12px;
      box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .mtitle{display:flex; align-items:center; gap:8px; margin:0 0 10px; flex-wrap:wrap}

  .flashbtn span{font-size:12.5px; font-weight:800; letter-spacing:.2px}

      border-radius:999px; min-width:17px; height:17px; line-height:17px}
  .froll{flex:1; overflow-y:auto; padding-bottom:30px}

  .fdate small{font-size:10.5px; color:#8793a5}
  .fcol{flex:1; display:flex; flex-direction:column; gap:8px; border-left:2px solid #2d3848; padding-left:10px}
  .fcard{background:#f7f4ec; color:#1f2733; border-radius:14px; padding:10px 12px; border-left:4px solid var(--gold);
      transform-origin:top center}
  .fcard.fbacked{border-left-color:#b3702d; background:#f3ebe0}
  @keyframes roll{from{opacity:0; transform:perspective(600px) rotateX(-60deg) translateY(-8px)} to{opacity:1; transform:none}}
  .fcard img{width:100%; max-height:150px; object-fit:cover; border-radius:10px; margin-bottom:8px; display:block}
  .fbody{font-size:14.5px; font-weight:700; line-height:1.35} .fmeta{font-size:11.5px; color:#6b7387; margin-top:4px}
  .fend{text-align:center; color:#aab4c3; font-size:12.5px; margin:10px 0 20px; line-height:1.5}
  .fcalwrap{position:absolute; inset:0; z-index:5; background:#141a22; display:flex; flex-direction:column; align-items:center;
      justify-content:center; transition:opacity .35s ease; perspective:900px}
  .fcalwrap.gone{opacity:0}
  .slotbox{position:relative; width:min(88vw, 360px); border-radius:20px; padding:10px; background:linear-gradient(#c0463f,#9c3530);
      box-shadow:0 16px 40px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.2)}
  .slotwin{height:96px; overflow:hidden; border-radius:12px; background:#fbf8f1; position:relative}

  .slottext{font-size:16px; font-weight:800; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}

  .slotimg{flex:0 0 72px; width:72px; height:72px; object-fit:cover; border-radius:10px; display:block}
  .slotcount{margin-top:12px; font-size:12px; font-weight:800; color:#e8b84b; letter-spacing:.5px; min-height:16px}

  .fcalhint{margin-top:18px; font-size:11.5px; color:#6b7a8f}
  .remchips{margin:6px 0 10px} .remtime{display:flex; align-items:center; gap:8px; font-size:14px; margin:0 0 10px}

  .installchip{align-self:center; font-size:12px; font-weight:800; color:#7a5a0c; background:#faf3df;

  .dfetch{position:relative; border-color:var(--gold); background:#fffdf5; align-items:flex-start}
  .dfetch .ft{flex:1; min-width:0} .dfetch .dfk{font-size:11px; font-weight:800; color:#8a6a14; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px}

  .dfx{position:absolute; top:6px; right:10px; color:var(--sub); text-decoration:none; font-size:15px}

  .rpk{font-size:11px; font-weight:800; color:#8a6a14; text-transform:uppercase; letter-spacing:.5px}
  .rpt{font-size:22px; font-weight:800}
  .rprow{display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:8px}
  .rprow span{font-size:22px; line-height:1.2} .rprow b{display:block; font-size:15px} .rprow small{display:block; color:var(--sub); font-size:12.5px; margin-top:2px}
  .proof{background:#eef6f2; border:1px solid #cfe5da; color:#2f7d5f; border-radius:12px; padding:9px 12px; font-size:13px; margin:12px 0 4px}

  body.wall .nav,body.wall .tabbar,body.wall .installchip,body.wall .searchbar,body.wall .chips,body.wall .newbie,body.wall .packhero,body.wall .toast{display:none !important}
  body.wall .tilegrid{grid-template-columns:repeat(3, 1fr); gap:14px} body.wall .tile{min-height:180px} body.wall .tname{font-size:18px} body.wall .tsnippet{font-size:16px}
  body.wall #root{padding:18px 24px 0; max-width:none}

var PLACE_TTL = 7*24*3600*1000;
function getPlace(){ try{ return localStorage.getItem('vp.place'); }catch(e){ return null; } }

function refreshPlaceIfStale(){
  if (!getPlace() || placeIsManual() || !placeStale() || !navigator.permissions) return;
  navigator.permissions.query({ name: 'geolocation' }).then(function(st){
    if (st.state !== 'granted') return;             // never surprise-prompt
    var before = getPlace();
    detectPlace(function(p){ if (p && p !== before) renderVoteStrip(); });
  }).catch(function(){});
}
function osmLabel(ad){
  var city = ad.city || ad.town || ad.village || ad.municipality || ad.county || '';
  var region = ad.state || ad.province || ad.region || '';
  return [city, region, ad.country || ''].filter(Boolean).join(', ');
}
function savePlace(place, manual){
  try {
    localStorage.setItem('vp.place', place);
    localStorage.setItem('vp.place_ts', String(Date.now()));
    if (manual) localStorage.setItem('vp.place_manual', '1'); else localStorage.removeItem('vp.place_manual');
  } catch (e) {}
}
function placeIsManual(){ try { return localStorage.getItem('vp.place_manual') === '1'; } catch (e) { return false; } }
function detectPlace(cb){
  if (!navigator.geolocation) { cb(null); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=en&lat=' +
          pos.coords.latitude + '&lon=' + pos.coords.longitude)
      .then(function(r){ return r.json(); })
      .then(function(g){
        var place = osmLabel(g.address || {});
        if (!place) { cb(null); return; }
        savePlace(place, false);
        cb(place);
      }).catch(function(){ cb(null); });
  }, function(){ cb(null); }, { timeout: 8000 });
}

function renderVoteStrip(){

  var place = getPlace();

    el.innerHTML = '<div class="votestrip" style="display:flex;align-items:center;gap:8px">📍 <b>Find your next election</b><span class="days" id="findloc" style="cursor:pointer;margin-left:auto">use my location</span><a href="#" class="chgloc" style="font-size:12px;color:#3b6fb6;white-space:nowrap">or type a city</a></div>';
    document.getElementById('findloc').onclick = function(){

    if (!list || !list.length) {
      var city = esc(place.split(',')[0]);
      var chg = ' <a href="#" class="chgloc" style="color:#3b6fb6;white-space:nowrap">change place</a>';
      el.innerHTML = '<div class="votestrip">🔎 Looking up votes in <b>' + city + '</b>…' + chg + '</div>';
      notePlace(place).then(function(s){
        if (getPlace() !== place || !document.getElementById('votestrip')) return;

function fillEntryElections(){

  });

function momentTiles(list, groupDecisions){
  var items = [], byDate = {}, voice = [];

    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; items.push({ qd: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else items.push({ e: e });
  });
  var tiles = items.map(function(it){
    if (it.qd) {
      var qs = byDate[it.qd], seen = {}, links = [];
      qs.forEach(function(q){ (q.actions || []).forEach(function(a){ if (!seen[a.url]) { seen[a.url] = 1; links.push(a); } }); });
      return { cls: 'green', kind: 'Ballot questions', days: qs[0].days,
        title: qs.length + ' question' + (qs.length === 1 ? '' : 's') + ' on your ballot',
        body: qs.map(function(q){ return '<div class="qname">' + esc(q.name) + '</div>' + (q.how ? '<div>' + esc(q.how) + '</div>' : ''); }).join('') +
              '<div>' + actionLinks(links) + '</div>' };
    }
    var e = it.e;
    if (e.estimated) return { cls: 'red est', kind: 'Election · estimated', days: e.days, est: true, title: e.name,
      body: '<b>' + esc(e.name) + '</b>\n<i>Estimated: ' + esc(e.estimate_note || 'no date announced yet') +
            '. Official sources say when it&rsquo;s due, but no date is set yet. We&rsquo;ll replace this with the real date.</i>\n' + momentBody(e) };
    return { cls: e.kind === 'election' ? 'red' : (e.kind === 'voice' ? 'blue' : 'green'),
      kind: e.kind === 'election' ? 'Election' : (e.kind === 'voice' ? 'Have your say' : 'Ballot question'),
      days: e.days, title: e.name, body: '<b>' + esc(e.name) + '</b>\n' + momentBody(e) };
  });
  if (voice.length) tiles.push({ cls: 'blue', kind: 'Have your say', days: voice[0].days,
    title: (voice.length >= 40 ? '40+' : voice.length) + ' open consultation' + (voice.length === 1 ? '' : 's'),
    body: '<div>Anyone can comment — you don’t need to be a citizen or a voter.</div>' + voiceItems(voice, groupDecisions ? 8 : 12) });
  return tiles;

function renderMoments(list, groupDecisions){
  var out = [], byDate = {}, order = [], voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; order.push({ q: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else order.push(e);
  });
  order.forEach(function(r){ out.push(r.q ? groupedQuestionsRow(byDate[r.q]) : momentRow(r)); });
  if (voice.length) out.push(groupedVoiceRow(voice, groupDecisions ? 6 : 10));
  return out.join('');
}

// Interactive first-run tour: spotlights the real controls on the pup page, one at a time.
// The spotlighted control stays tappable; everything else is dimmed. Replay from Manage pup.
function startTour(name, k0){
  var nm = esc(name);
  var steps = [
    { sel: '#tab-plus', text: 'Tap <b>+</b> anytime to tell ' + nm + ' what should be fixed.' },
    { sel: '#votestrip', text: '<b>When you can act 🗳️</b> ' + nm + ' brings your issues back at voting time.' },
    { sel: '#navman', text: '<b>⚙️ Back up ' + nm + '</b> with Google so you never lose it.', last: true }
  ].filter(function(s){ return document.querySelector(s.sel); });
  if (!steps.length) return;
  var k = Math.min(k0 || 0, steps.length - 1);
  var dim = document.createElement('div'); dim.className = 'tourdim';
  var hole = document.createElement('div'); hole.className = 'tourhole';
  var tip = document.createElement('div'); tip.className = 'tourtip';
  document.body.appendChild(dim); document.body.appendChild(hole); document.body.appendChild(tip);
  function end(){
    [dim, hole, tip].forEach(function(x){ if (x.parentNode) x.parentNode.removeChild(x); });
    window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
    try { localStorage.setItem('vp.toured', '1'); } catch (e) {}
    var s0 = loadLocal(); var asked = false; try { asked = !!localStorage.getItem('vp.remasked'); } catch (e) {}
    if (s0 && !remPref() && !asked && !KIOSK) setTimeout(function(){ reminderSheet(s0.tail, s0.name); }, 300);
  }
  function place(){
    var s = steps[k], el = document.querySelector(s.sel);
    if (!el) { end(); return; }
    var r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = 'top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + 2 * pad) + 'px;height:' + (r.height + 2 * pad) + 'px';
    var th = tip.offsetHeight, vh = window.innerHeight;
    var below = r.bottom + 12 + th < vh - 8 && (r.top + r.height / 2 < vh / 2 || r.top - 12 - th < 8);
    var top = below ? r.bottom + 12 : r.top - 12 - th;
    tip.style.top = Math.max(8, Math.min(top, vh - th - 8)) + 'px';
  }
  function show(){
    var s = steps[k], el = document.querySelector(s.sel);
    tip.innerHTML = '<div class="tourtxt">' + s.text + '</div><div class="tourrow"><span>' + (k + 1) + ' / ' + steps.length + '</span>' +
      '<a href="#" id="tskip">Skip</a>' + (k ? '<button class="tbtn ghost" id="tback">Back</button>' : '') +
      (s.last && GOOGLE_READY && !KIOSK ? '<button class="tbtn" id="tman">🔐 Back up now</button><button class="tbtn ghost" id="tnext">Done</button>'
                                        : '<button class="tbtn" id="tnext">' + (s.last ? 'Done' : 'Next') + '</button>') + '</div>';
    if (!el.closest('.tabbar')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    requestAnimationFrame(function(){ requestAnimationFrame(place); });
    document.getElementById('tskip').onclick = function(ev){ ev.preventDefault(); end(); };
    document.getElementById('tnext').onclick = function(){ if (s.last) end(); else { k++; show(); } };
    var b = document.getElementById('tback'); if (b) b.onclick = function(){ k--; show(); };
    var m = document.getElementById('tman'); if (m) m.onclick = function(){ end(); location.href = '/manage'; };
  }
  // tapping the spotlighted control itself ends the tour and lets it do its job
  hole.onclick = function(){ var el = document.querySelector(steps[k].sel); end(); if (el) (el.querySelector('textarea') || el).click(); };
  window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
  show();
}

// sticker: 50x30mm-ish label PNG via canvas -> download / share
function renderSticker(name, url, cb, words){
  words = words || { l1: 'remembers what', l2: 'you care about.', cta: 'Scan to visit your pup →' };
  var W = 900, H = 540, c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#e8b84b'; x.lineWidth = 10; x.strokeRect(5, 5, W - 10, H - 10);
  var face = new Image(), qimg = new Image(), left = 2;
  function draw(){
    if (--left) return;
    x.save(); x.beginPath(); x.arc(110, 118, 70, 0, Math.PI * 2); x.clip();
    x.drawImage(face, 40, 48, 140, 140); x.restore();
    x.beginPath(); x.arc(110, 118, 70, 0, Math.PI * 2); x.lineWidth = 6; x.strokeStyle = '#e8b84b'; x.stroke();
    x.drawImage(qimg, W - 430, 60, 390, 390);
    x.fillStyle = '#2a2418';
    var fs = 58; do { x.font = '900 ' + fs + 'px sans-serif'; fs -= 2; } while (fs > 18 && x.measureText(name.toUpperCase()).width > 250);
    x.fillText(name.toUpperCase(), 200, 140);
    x.font = '600 32px sans-serif'; x.fillStyle = '#55677a';
    x.fillText(words.l1, 44, 270); x.fillText(words.l2, 44, 312);
    x.font = '600 24px sans-serif'; x.fillText(words.cta, 44, 380);
    x.font = '800 36px sans-serif'; x.fillStyle = '#2a2418'; x.fillText('voterpup.com', 44, 480);
    cb(c);
  }
  face.onload = draw; face.onerror = function(){ face = document.createElement('canvas'); draw(); };
  qimg.onload = draw;
  face.src = '/pup-face.jpg';
  qimg.src = qrDataURL(url, 8);
}

    if (!L) { root.innerHTML = nav() + say('This pup couldn&rsquo;t be found.', 'start a new one') + tabbar('manage'); wireTabs(); return; }
    var n = L.entries.length, nm = esc(L.name), backed = isBackedUp(tail);
    var rows = (canOfferInstall() ? mrow('<img src="/icon-192.png" alt="">', '📲 Get the app', 'Home-screen icon, full screen, reminders.',
        '<button class="btn gold mbtn" id="minstall">Install VoterPup</button>') : '') +
      (KIOSK ? '' : mrow(slotMedia('share'), 'Make them earn your vote', 'Candidates see your issues, never you.',
        '<button class="btn gold mbtn" id="mshare"' + (n ? '' : ' disabled') + '>' + (n ? '📤 Share my issues' : 'Tell ' + nm + ' one issue first') + '</button>'));
    if (GOOGLE_READY && !KIOSK) {
      if (email && backed) rows += mrow('<img src="' + BACKUP_IMG + '" alt="">', '✅ ' + nm + ' has a home',
        'Saved to <b>' + esc(email) + '</b>',
        '<button class="btn ghost mbtn" id="mpups">My pups</button><button class="btn ghost mbtn" id="mout">Sign out</button>' +
        '<a href="#" class="mlink" id="mshowkey">show private link</a><div id="mkey" hidden></div>');
      else rows += mrow('<img src="' + BACKUP_IMG + '" alt="">', '🔐 Give ' + nm + ' a home',
        (email ? 'Signed in as <b>' + esc(email) + '</b>' : 'Never lose ' + nm + '. No mail, ever.'),
        '<button class="btn gold mbtn" id="mbackup">' + (email ? 'Add ' + nm + ' to my account' : 'Back up with Google') + '</button><div id="mslot"></div>');
    }
    if (!(email && backed)) rows += mrow('<div class="mkeythumb">🔑</div>', 'Private link',
      'Your only key until you back up.',
      '<button class="btn ghost mbtn" id="mcopy">Copy link</button><button class="btn ghost mbtn" id="mstk">🏷️ Key sticker</button>');
    if (!KIOSK) rows += mrow('<img src="/pup-sit.webp" alt="" style="object-position:50% 12%">', '🔔 Reminders', remLabel(remPref()),
      '<button class="btn ' + (remPref() && !remPref().off ? 'ghost' : 'gold') + ' mbtn" id="mrem">' + (remPref() && !remPref().off ? 'Change' : 'Turn on') + '</button>');
    rows += mrow('<img id="invthumb" alt="">', '🐾 Invite your friends',
      '',
      '<button class="btn gold mbtn" id="minv">Share invite</button><button class="btn ghost mbtn" id="minvstk">🏷️ Invite sticker</button>');
    rows += mrow('<img src="/pup-watch.jpg" alt="">', '🐶 Pups', '',
      (GOOGLE_READY && !KIOSK && !(email && backed) ? '<button class="btn ghost mbtn" id="mpups">My backed-up pups</button><div id="mrslot"></div>' : '') +
      '<button class="btn ghost mbtn" id="mnew">＋ Start another pup</button><button class="btn ghost mbtn" id="mtour">▶ Take the tour</button>');
    root.innerHTML = nav() + '<div class="mtitle" id="mtitle"><span class="q" style="font-size:20px">' + nm + ' ⚙️</span>' +
      (KIOSK ? '' : '<a href="#" class="mlink" id="mrename">✏️ Rename</a>') + '</div>' + rows +
      '<footer><a href="/privacy.html">Privacy</a> · <a href="mailto:hi@voterpup.com">hi@voterpup.com</a></footer>' + tabbar('manage');
    wireTabs(); wireHero();
    var on = function(id, fn){ var el = document.getElementById(id); if (el) el.onclick = fn; };
    on('mshare', function(){ if (n) showCandidate(tail, L.name); });
    on('mrem', function(){ reminderSheet(tail, L.name, screenManage); });
    on('minstall', function(){ installApp(); });
    on('mrename', function(ev){
      ev.preventDefault();
      var t = document.getElementById('mtitle');
      t.innerHTML = '<input id="mnewname" maxlength="24" value="' + nm + '"><button class="btn gold mbtn" id="msavename">Save</button>' +
        '<button class="btn ghost mbtn" id="mcancelname">Cancel</button>';
      var inp = document.getElementById('mnewname'); inp.focus(); inp.select();
      var save = function(){
        var v = inp.value.trim(); if (!v || v === L.name) { screenManage(); return; }
        rpc('vp_rename_ledger', { p_tail: tail, p_name: v }).then(function(r){
          saveLocal(tail, r.name); toast('Say hi to ' + esc(r.name) + ' 🐾'); screenManage();
        }).catch(function(e){ alert(e.message); });
      };
      document.getElementById('msavename').onclick = save;
      inp.onkeydown = function(e){ if (e.key === 'Enter') save(); if (e.key === 'Escape') screenManage(); };
      document.getElementById('mcancelname').onclick = function(){ screenManage(); };
    });
    on('mcopy', function(){ var b = this; navigator.clipboard.writeText(url).then(function(){ b.textContent = 'Copied ✓'; }); });
    on('mstk', function(){ makeSticker(L.name, url); });
    on('mshowkey', function(ev){ ev.preventDefault(); var k = document.getElementById('mkey'); k.hidden = false; this.style.display = 'none';
      k.innerHTML = '<div class="linkbox">' + esc(url) + '</div><button class="btn ghost mbtn" id="mcopy2">Copy link</button>';
      on('mcopy2', function(){ var b = this; navigator.clipboard.writeText(url).then(function(){ b.textContent = 'Copied ✓'; }); }); });
    on('mbackup', function(){
      var mb = this; mb.style.display = 'none';
      if (sess) sb.rpc('vp_claim_ledger', { p_tail: tail }).then(function(x){ if (x.error) throw new Error(x.error.message); markBackedUp(tail); screenManage(); })
        .catch(function(e){ mb.style.display = ''; alert('Backup didn’t finish: ' + e.message); });
      else startBackup(tail, document.getElementById('mslot'), screenManage);
    });
    on('mpups', function(){ if (sess) screenRestore(); else { this.style.display = 'none'; startRestore(document.getElementById('mrslot')); } });
    on('mout', function(){ sb.auth.signOut().then(function(){ screenManage(); }); });
    on('mnew', function(){
      if (!(email && backed) && !confirm(L.name + ' isn\u2019t backed up yet. This device will switch to the new pup, and ' + L.name + ' will only be reachable through its private link. Continue?')) return;
      location.href = '/app.html?new=1'; });
    on('mtour', function(){ try { sessionStorage.setItem('vp.tour', '1'); } catch (e) {} location.href = url; });
    on('minv', function(){
      var b = this, msg = 'I gave my city&rsquo;s issues to a pup that remembers them at voting time. Get yours:'.replace('&rsquo;', '’');
      if (navigator.share) navigator.share({ title: 'VoterPup', text: msg, url: INVITE_URL }).catch(function(){});
      else navigator.clipboard.writeText(msg + ' ' + INVITE_URL).then(function(){ b.textContent = 'Copied ✓'; });
    });
    renderSticker('Join the pack', INVITE_URL, function(c){
      var im = document.getElementById('invthumb'); if (im) im.src = c.toDataURL('image/png');
      on('minvstk', function(){ showSticker(c, 'Join the pack', INVITE_URL); });
    }, INVITE_WORDS);
  }).catch(function(e){ root.innerHTML = nav() + say('Couldn&rsquo;t load this.', esc(e.message)) + tabbar('manage'); wireTabs(); });
}

// ---------- router ----------
(function(){
  var m = location.pathname.match(/^\/p\/(.+)$/);
  var qs = new URLSearchParams(location.search);
  var vm = location.pathname.match(/^\/v\/([0-9a-f]{20})$/);
  if (vm) screenView(vm[1]);
  else if (m && qs.get('report') === '1') screenReport(decodeURIComponent(m[1]));
  else if (m) screenLedger(decodeURIComponent(m[1]));
  else if (location.pathname === '/pack') screenPack(undefined, new URLSearchParams(location.search).get('t') || null);
  else if (location.pathname === '/manage') screenManage();
  else if (qs.get('new') === '1' || KIOSK || !loadLocal()) screenCapture();   // first visit: make your pup
  else screenPack();
})();
</script>
<script>
  window.goatcounter = { path: function(p) { return p.indexOf('/p/') === 0 ? '/p/(pup)' : (p.indexOf('/v/') === 0 ? '/v/(view)' : p); } };
</script>
<script data-goatcounter="https://voterpup.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
