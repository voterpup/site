.deck{transform:scale(var(--ms,1));transform-origin:13px 34px;transition:transform .15s}.shoppin{transform:scale(calc(var(--ms,1) + .15));transform-origin:22px 44px;transition:transform .15s}.far .deck b,.far .deck .ph{display:none}

function b64u(bytes){ var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function newKey(){ return b64u(crypto.getRandomValues(new Uint8Array(32))); }
function aes(k){ return crypto.subtle.importKey('raw', unb64u(k), { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']); }
function encBytes(k, bytes){ var iv = crypto.getRandomValues(new Uint8Array(12)); return aes(k).then(function(key){ return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, bytes); }).then(function(ct){ var out = new Uint8Array(12 + ct.byteLength); out.set(iv, 0); out.set(new Uint8Array(ct), 12); return out; }); }

function std64(bytes){ var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
function unstd64(str){ var bin = atob(str), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }

function ownerStrip(c){ return '<div class="oact">' + (c.awaiting ? '<button class="icb on" data-oappr="' + c.code + '">✓ Approve</button>' : '<button class="icb' + (c.pinned ? ' on' : '') + '" data-opin="' + c.code + '">' + I.pin + (c.pinned ? ' Pinned' : ' Pin') + '</button>') + '<button class="icb' + (c.hidden ? ' on' : '') + '" data-ohide="' + c.code + '">' + (c.hidden ? 'Show' : 'Hide') + '</button><button class="icb rm" data-orm="' + c.code + '">Remove</button></div>'; }
function arm(b){ if (b.dataset.armed === '1') return true; b.dataset.armed = '1'; var t = b.textContent; b.textContent = 'For good?'; setTimeout(function(){ b.dataset.armed = '0'; b.textContent = t; }, 4000); return false; }   // Remove asks twice
function cardHtml(c, i, owner){   // owner: Pin and Hide sit on every card, and hidden posts stay visible to the owner, dimmed
  var by = '<div class="ft">' + (c.maker_photo ? '<img src="' + esc(c.maker_photo) + '" alt="">' : '') + '<span class="nm">' + esc(c.maker_name || 'Someone') + ' · ' + esc(fmt(c.created_at)) + '</span>' + heartBtn(c) + '</div>';
  var pin = (c.pinned ? '<div class="pinbadge2">Pinned</div>' : '') + (c.awaiting ? '<div class="pinbadge2 wait">' + (owner ? 'Awaiting your OK' : 'Waiting for the shop') + '</div>' : c.hidden ? '<div class="pinbadge2 hid">Hidden</div>' : ''), oa = owner ? ownerStrip(c) : '', cls = c.hidden || c.awaiting ? ' hid' : '';
  if (c.photo_url || c.video_url) return '<div class="mc' + cls + '" data-open="' + c.code + '">' + pin + (c.photo_url ? '<img class="p" src="' + esc(c.photo_url) + '" alt="" loading="lazy">' : '<video class="p" src="' + esc(c.video_url) + '" preload="metadata" muted playsinline></video><div class="play">▶</div>') + (c.body ? '<div class="cap">' + esc(c.body) + '</div>' : '') + by + oa + '</div>';
  return '<div class="mc paper ' + PAPER[i % 4] + cls + '" data-open="' + c.code + '">' + pin + '<div class="tx">' + esc(c.body || '') + '</div>' + by + oa + '</div>';
}
function orderCards(cards, filter){   // pinned first, then by month, newest first; the flat list is the lightbox order
  var list = cards.filter(function(c){ var med = !!(c.photo_url || c.video_url); return filter === 'photos' ? med : filter === 'notes' ? !med : true; });
  var groups = [], byKey = {};
  list.forEach(function(c){ var k = c.pinned ? 'Pinned by the shop' : monthOf(c.created_at); if (!byKey[k]) { byKey[k] = []; groups.push({ k: k, items: byKey[k] }); } byKey[k].push(c); });
  groups.sort(function(a, b){ return (b.k === 'Pinned by the shop') - (a.k === 'Pinned by the shop'); });   // pinned first, whatever order the cards came in
  return { groups: groups, flat: [].concat.apply([], groups.map(function(g){ return g.items; })) };
}
function wallHtml(cards, filter, addUrl, owner){
  var o = orderCards(cards, filter);
  if (!o.flat.length) return '<div class="wall"><div class="empty">' + (cards.length ? 'Nothing here under this filter.' : 'No memories yet. Yours could be the first.') + '</div>' + (addUrl ? '<a class="mc add" href="' + addUrl + '">+ Add yours</a>' : '') + '</div>';
  return o.groups.map(function(g, gi){ return '<div class="sec"><div class="k">' + esc(g.k) + '</div><small>' + g.items.length + '</small></div><div class="wall' + (g.items.length === 1 ? ' one' : '') + '">' + g.items.map(function(c, i){ return cardHtml(c, i, owner); }).join('') + (gi === o.groups.length - 1 && addUrl ? '<a class="mc add" href="' + addUrl + '">+ Add yours</a>' : '') + '</div>'; }).join('');
}
function toggleHeart(c, send){   // optimistic; `send(on)` does the real call and resolves {hearts}
  var on = !c.hearted; c.hearted = on; c.hearts = Math.max(0, (c.hearts || 0) + (on ? 1 : -1));
  function paint(){ document.querySelectorAll('[data-heart="' + c.code + '"]').forEach(function(b){ b.classList.toggle('on', !!c.hearted); b.querySelector('span').textContent = c.hearts || ''; }); }
  paint(); document.querySelectorAll('[data-heart="' + c.code + '"]').forEach(function(b){ b.classList.add('pop'); setTimeout(function(){ b.classList.remove('pop'); }, 400); });
  send(on).then(function(r){ if (r && typeof r.hearts === 'number') { c.hearts = r.hearts; paint(); } }).catch(function(e){ c.hearted = !on; c.hearts = Math.max(0, c.hearts + (on ? -1 : 1)); paint(); toast(e.message); });
}
function lightbox(cards, idx, send){   // full-screen viewer: swipe or arrow keys between memories, heart from here too
  var el = document.getElementById('lb'); if (!el) { el = document.createElement('div'); el.id = 'lb'; el.className = 'lb'; document.body.appendChild(el); }
  var i = idx;
  function draw(){ var c = cards[i];
    el.innerHTML = '<div class="bar"><span>' + (i + 1) + ' / ' + cards.length + (c.pinned ? ' · pinned' : '') + (c.awaiting ? ' · awaiting OK' : '') + '</span><button class="x" id="lbx" aria-label="Close">×</button></div>' +
      '<div class="stage" id="lbs">' + (c.photo_url ? '<img src="' + esc(c.photo_url) + '" alt="">' : c.video_url ? '<video src="' + esc(c.video_url) + '" controls autoplay playsinline></video>' : '<div class="paper2">' + esc(c.body || '') + '</div>') + (cards.length > 1 ? '<button class="nav l" id="lbl" aria-label="Previous">‹</button><button class="nav r" id="lbr" aria-label="Next">›</button>' : '') + '</div>' +
      '<div class="info">' + ((c.photo_url || c.video_url) && c.body ? '<div class="cap">' + esc(c.body) + '</div>' : '') + '<div class="ft">' + (c.maker_photo ? '<img src="' + esc(c.maker_photo) + '" alt="">' : '') + '<span class="nm">' + esc(c.maker_name || 'Someone') + ' · ' + esc(fmtWhen(c.created_at)) + '</span>' + heartBtn(c) + '</div></div>';
    document.body.style.overflow = 'hidden';
    document.getElementById('lbx').onclick = close; var l = document.getElementById('lbl'), r = document.getElementById('lbr'); if (l) { l.onclick = function(ev){ ev.stopPropagation(); go(-1); }; r.onclick = function(ev){ ev.stopPropagation(); go(1); }; }
    el.querySelector('[data-heart]').onclick = function(ev){ ev.stopPropagation(); toggleHeart(c, send); };
    var st = document.getElementById('lbs'), x0 = null; st.ontouchstart = function(e){ x0 = e.touches[0].clientX; }; st.ontouchend = function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); };
    st.onclick = function(e){ if (e.target === st) close(); };
    var v = st.querySelector('video'); if (v) v.onclick = function(e){ e.stopPropagation(); };
  }
  function go(d){ i = (i + d + cards.length) % cards.length; draw(); }
  function close(){ el.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', key); }
  function key(e){ if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1); }
  document.addEventListener('keydown', key); draw(); track('lightbox', { photo: !!cards[idx].photo_url });
}

    .catch(function(){ $(hdr() + '<h2>No spot here.</h2><a class="btn gold" href="/myspot/">Leave one of your own</a>'); });
}

function stopHunt(){ if (_watch !== null) { navigator.geolocation.clearWatch(_watch); _watch = null; } window.removeEventListener('deviceorientationabsolute', onHead); window.removeEventListener('deviceorientation', onHead); }
function onHead(e){ var h = (typeof e.webkitCompassHeading === 'number') ? e.webkitCompassHeading : (e.absolute || e.type === 'deviceorientationabsolute') && typeof e.alpha === 'number' ? (360 - e.alpha) % 360 : null; if (h !== null) { _head = h; drawArrow(); } }
function drawArrow(){ var a = document.getElementById('arrow'), n = document.getElementById('north'); if (!a) return; var rot = _head === null ? _bearing : (_bearing - _head + 360) % 360; a.style.transform = 'rotate(' + rot + 'deg)'; if (n) n.style.transform = 'rotate(' + (_head === null ? 0 : (360 - _head) % 360) + 'deg)'; var l = document.getElementById('headnote'); if (l) l.textContent = _head === null ? 'Arrow is relative to north (hold the phone flat, top pointing north).' : 'Point the phone where the arrow points.'; }
function askHeading(){ if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') { DeviceOrientationEvent.requestPermission().then(function(st){ if (st === 'granted') window.addEventListener('deviceorientation', onHead); drawArrow(); }).catch(drawArrow); } else { window.addEventListener('deviceorientationabsolute', onHead); window.addEventListener('deviceorientation', onHead); drawArrow(); } }
function hunt(code, s, r){
  _bearing = r.bearing_deg || 0;
  var needsTap = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
  $(hdr() + '<div class="k">Not there yet</div><div class="spot" style="align-items:center;text-align:center"><div class="pinbadge">' + I.pin + '</div>' +
    '<div style="position:relative;width:170px;height:170px;margin:6px auto 0"><div style="position:absolute;inset:0;border-radius:50%;border:2px solid var(--spotline)"></div><div id="north" style="position:absolute;inset:0;transition:transform .3s"><span style="position:absolute;left:50%;top:6px;transform:translateX(-50%);font:900 12px Nunito;color:var(--sub)">N</span></div>' +
    '<svg id="arrow" viewBox="0 0 100 100" style="position:absolute;inset:16px;width:138px;height:138px;transition:transform .3s"><polygon points="50,6 68,62 50,52 32,62" fill="#f5b83d"/><polygon points="50,52 68,62 50,94 32,62" fill="#a8740a" opacity=".8"/></svg></div>' +
    '<div class="dist" id="dist">' + km(r.distance_m) + '</div><div class="meta">from the spot</div><div class="muted" id="headnote" style="color:var(--spotsub)"></div>' + (s.clue ? '<div class="clue" style="text-align:left">' + I.compass + ' ' + esc(s.clue) + '</div>' : '') + '</div>' +
    '<div class="map" id="m" style="height:200px"></div>' +
    '<p class="lead">Walk toward the arrow. It opens by itself within about ' + (s.radius_m || 40) + ' metres.</p>' +
    (needsTap ? '<button class="btn" id="cmp">Turn on the compass</button>' : '') + '<a class="btn" href="' + dirUrl(s.lat, s.lng) + '" target="_blank" rel="noopener">' + I.compass + ' Get directions (Google Maps)</a><a class="btn" href="/myspot/?d=' + code + '">Stop</a>');
  var m = mkMap(document.getElementById('m'), s.lat, s.lng, 16); addPin(m, s.lat, s.lng, s.visibility === 'public' ? 'public' : 'shared'); var me = LAST_POS ? addPin(m, LAST_POS.lat, LAST_POS.lng, 'here') : null; if (LAST_POS) m.fitBounds([[s.lat, s.lng], [LAST_POS.lat, LAST_POS.lng]], { padding: [30, 30] }); setTimeout(function(){ m.invalidateSize(); }, 50);
  if (needsTap) document.getElementById('cmp').onclick = function(){ this.classList.add('hidden'); askHeading(); }; else askHeading();
  drawArrow();
  var last = 0;
  if (navigator.geolocation) _watch = navigator.geolocation.watchPosition(function(p){
    var now = Date.now(); if (now - last < 4000) return; last = now; LAST_POS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
    if (me) me.setLatLng([p.coords.latitude, p.coords.longitude]); else me = addPin(m, p.coords.latitude, p.coords.longitude, 'here');
    api({ action: 'open', code: code, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }).then(function(r2){
      if (r2.there) { track('open_try', { there: true, d: r2.distance_m, live: true }); opened(code, s, r2); return; }
      if (r2.sealed) { opened(code, s, r2); return; }
      _bearing = r2.bearing_deg || _bearing; var d = document.getElementById('dist'); if (d) d.textContent = km(r2.distance_m); drawArrow();
    }).catch(function(){});
  }, function(){}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function opened(code, s, r){
  if (r.sealed) { $(hdr() + '<div class="k">Not yet</div><h2>It opens ' + esc(fmtWhen(r.opens_at)) + '.</h2><p class="lead">Come back then. You’re ' + km(r.distance_m) + ' from the spot.</p><a class="btn" href="/myspot/?d=' + code + '">Back</a>'); return; }
  if (!r.there) { hunt(code, s, r); return; }
  if (r.enc) { var k = keyOf(code);
    if (!k) { $(hdr() + '<div class="k">You found it</div><div class="spot open"><div class="pinbadge">' + I.lock + '</div><div class="body">This memory is end-to-end encrypted.</div><div class="who">Open it from the original link: the key is in it, and never with us.</div></div><a class="btn" href="/myspot/?map=1">See the map</a>'); return; }
    if (!r._dec) { Promise.all([r.body ? decText(k, r.body) : Promise.resolve(''), r.photo_url ? decPhotoUrl(k, r.photo_url) : Promise.resolve(null)]).then(function(p){ r.body = p[0]; r.photo_url = p[1]; r._dec = true; opened(code, s, r); }).catch(function(){ r.body = ''; r.photo_url = null; r._dec = true; r._bad = true; opened(code, s, r); }); return; } }
  function render(log){
    $(hdr() + '<div class="k">You found it</div><div class="spot open"><div class="pinbadge">' + I.pin + '</div><div class="who">' + (r.maker_photo ? '<img src="' + esc(r.maker_photo) + '" alt="">' : '') + esc(r.maker_name || 'Someone') + ' left this · ' + esc(fmt(r.buried_at)) + '</div>' + (r.photo_url ? '<img class="ph" src="' + esc(r.photo_url) + '" alt="">' : '') + (r.body ? '<div class="body">' + esc(r.body) + '</div>' : '') + (r._bad ? '<div class="who">The key in this link doesn’t fit this memory.</div>' : '') + (r.enc ? '<div class="secure" style="justify-content:flex-start">' + I.lock + ' End-to-end encrypted ✅</div>' : '') + '</div>' +
      '<div class="box"><div class="k">Logbook</div>' + (log.length ? '<div class="log">' + log.map(function(f){ return '<div>' + (f.note ? esc(f.note) : '<i>found it</i>') + '<small>' + esc(f.finder_name || 'Someone') + ' · ' + esc(fmt(f.created_at)) + '</small></div>'; }).join('') + '</div>' : '<div class="muted">You’re the first here.</div>') + '</div>' +
      (ME ? '<div class="box"><div style="font-weight:900">Leave a note here</div><textarea id="n" class="in" maxlength="300" placeholder="I was here. Thank you."></textarea><div class="err hidden" id="e"></div><button class="btn" id="rep">Leave it</button></div>' : signinBox('Sign in to leave a note here')) +
      '<a class="btn gold" href="/myspot/">Leave one back</a><a class="btn" href="/myspot/?map=1">See the map</a>');
    if (ME) { document.getElementById('rep').onclick = function(){ var n = document.getElementById('n').value.trim(), err = document.getElementById('e'); if (!n) return; this.disabled = true;
      locate().then(function(p){ return api({ action: 'reply', code: code, note: n, lat: p.lat, lng: p.lng, acc: p.acc }); }).then(function(j){ track('reply', {}); toast('Left here.'); render(j.logbook); })
        .catch(function(e){ err.textContent = e.message; err.classList.remove('hidden'); document.getElementById('rep').disabled = false; }); }; }
    else wireSignin(function(){ render(log); });
  }
  render(r.logbook || []); track('found', { role: r.is_maker ? 'maker' : 'finder' });
}

function manageBox(s){
  var opts = [['personal', 'Personal'], ['link', 'Private link'], ['public', 'Public'], ['hidden', 'Hidden']].filter(function(o){ return !(s.enc && o[0] === 'public'); });
  return '<div class="box" id="manage"><div class="k">Who can find it</div><div class="row"><select class="in" id="mvis" style="flex:1;width:auto">' + opts.map(function(o){ return '<option value="' + o[0] + '"' + (s.visibility === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select><button class="btn sm" id="mdel" style="color:var(--bad);border-color:var(--bad)">Delete</button></div>' + (s.enc ? '<div class="muted">Encrypted memories can’t be made public.</div>' : '') + '</div>';
}
function wireManage(s, afterDelete){
  var sel = document.getElementById('mvis'); if (sel) sel.onchange = function(){ api({ action: 'toggle', code: s.code, visibility: sel.value }).then(function(){ track('toggle', { vis: sel.value }); toast('Now: ' + sel.options[sel.selectedIndex].text); }).catch(function(e){ toast(e.message); sel.value = s.visibility; }); };
  var del = document.getElementById('mdel'); if (del) del.onclick = function(){ if (del.dataset.armed !== '1') { del.dataset.armed = '1'; del.textContent = 'Delete for good?'; setTimeout(function(){ del.dataset.armed = '0'; del.textContent = 'Delete'; }, 4000); return; }
    del.disabled = true; api({ action: 'delete', code: s.code }).then(function(){ var k = keys(); delete k[s.code]; ls('ms.keys', JSON.stringify(k)); track('delete', {}); toast('Deleted.'); afterDelete(); }).catch(function(e){ toast(e.message); del.disabled = false; del.textContent = 'Delete'; }); };
}

// ---------- mine ----------
function mine(){
  if (!ME) { $(hdr() + '<h2>Your memories</h2>' + signinBox('Sign in to see what you left')); wireSignin(mine); return; }
  $(hdr() + '<div class="k">Mine</div><h2>What you left.</h2><div class="list" id="l"><div class="muted">Loading…</div></div><a class="btn gold" href="/myspot/">Leave another</a><div class="row"><button class="lnk" id="kcopy">Back up private keys</button><button class="lnk" id="kpaste">Restore keys</button><button class="lnk" id="out">Sign out</button></div><div class="muted" style="text-align:center">Private memories are end-to-end encrypted; their keys live only on this phone. Back them up before changing phones.</div>');
  document.getElementById('kcopy').onclick = function(){ navigator.clipboard.writeText('memspots-keys:' + JSON.stringify(keys())).then(function(){ toast('Keys copied. Paste them somewhere safe.'); }); };
  document.getElementById('kpaste').onclick = function(){ var t = prompt('Paste your backed-up keys'); if (!t) return; try { var obj = JSON.parse(t.replace(/^memspots-keys:/, '')); var all = keys(); Object.keys(obj).forEach(function(c){ all[c] = obj[c]; }); ls('ms.keys', JSON.stringify(all)); toast('Keys restored.'); mine(); } catch (e) { toast('That didn’t look like a key backup.'); } };
  document.getElementById('out').onclick = function(){ sb.auth.signOut().then(function(){ location.href = '/myspot/'; }); };
  api({ action: 'mine' }).then(function(j){ var l = document.getElementById('l'); if (!j.spots.length) { l.innerHTML = '<div class="muted">Nothing left yet.</div>'; return; }
    l.innerHTML = j.spots.map(function(s){ var prev = s.enc ? (keys()[s.code] ? '' : 'Private memory (key not on this phone)') : (s.body || 'Photo'); return '<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><b id="pv' + s.code + '">' + (s.kind === 'place' ? I.shop + ' ' + esc(s.place_name) + ': ' : '') + (s.enc ? I.lock + ' ' : '') + (s.has_photo ? I.camera + ' ' : '') + esc(prev.slice(0, 60)) + (prev.length > 60 ? '…' : '') + '</b><small>' + esc(fmt(s.created_at)) + ' · found ' + s.finds.length + '×' + (s.clue ? ' · ' + esc(s.clue) : '') + '</small></div>' +
      '<select class="in" data-code="' + s.code + '"><option value="personal"' + (s.visibility === 'personal' ? ' selected' : '') + '>Personal</option><option value="link"' + (s.visibility === 'link' ? ' selected' : '') + '>Private link</option><option value="public"' + (s.visibility === 'public' ? ' selected' : '') + '>Public</option><option value="hidden"' + (s.visibility === 'hidden' ? ' selected' : '') + '>Hidden</option></select>' +
      '<div style="flex-basis:100%;display:flex;gap:8px;margin-top:4px"><button class="btn sm" data-share="' + s.code + '" style="flex:1">Share</button><a class="btn sm" href="' + (s.kind === 'place' ? '/myspot/?at=' + s.code : '/myspot/?d=' + s.code + (keys()[s.code] ? '#k=' + keys()[s.code] : '')) + '" style="flex:1">Open</a><a class="btn sm" href="/myspot/?qr=' + s.code + '" style="flex:1">QR tent</a>' + (s.kind === 'place' ? '' : '<button class="btn sm" data-del="' + s.code + '" style="flex:0 0 auto;color:var(--bad);border-color:var(--bad)">Delete</button>') + '</div>' +
      (s.finds.length ? '<div class="log" style="flex-basis:100%;margin-top:6px">' + s.finds.slice(0, 5).map(function(f){ return '<div>' + (f.note ? esc(f.note) : '<i>found it</i>') + '<small>' + esc(f.finder_name || 'Someone') + ' · ' + esc(fmt(f.created_at)) + '</small></div>'; }).join('') + '</div>' : '') + '</div>'; }).join('');
    j.spots.forEach(function(s){ var k = s.enc && keys()[s.code]; if (k && s.body) decText(k, s.body).then(function(txt){ var el = document.getElementById('pv' + s.code); if (el) el.innerHTML = I.lock + ' ' + (s.has_photo ? I.camera + ' ' : '') + esc(txt.slice(0, 60)) + (txt.length > 60 ? '…' : ''); }).catch(function(){}); });
    l.querySelectorAll('select').forEach(function(sel){ sel.onchange = function(){ api({ action: 'toggle', code: sel.dataset.code, visibility: sel.value }).then(function(){ track('toggle', { vis: sel.value }); toast('Now: ' + sel.options[sel.selectedIndex].text); }).catch(function(e){ toast('Could not change: ' + e.message); }); }; });
    l.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Delete for good?'; setTimeout(function(){ b.dataset.armed = '0'; b.textContent = 'Delete'; }, 4000); return; } b.disabled = true; api({ action: 'delete', code: b.dataset.del }).then(function(){ var k = keys(); delete k[b.dataset.del]; ls('ms.keys', JSON.stringify(k)); track('delete', {}); toast('Deleted.'); mine(); }).catch(function(e){ toast(e.message); b.disabled = false; b.textContent = 'Delete'; }); }; });
    l.querySelectorAll('[data-share]').forEach(function(b){ b.onclick = function(){ var sp = j.spots.filter(function(x){ return x.code === b.dataset.share; })[0]; if (sp && sp.kind === 'place') { var msg = '📍 ' + sp.place_name + ' is on My spot. A note from us that only opens inside, and a guestbook: ' + placeUrl(sp.code); if (navigator.share) navigator.share({ text: msg }).catch(function(){}); else navigator.clipboard.writeText(msg).then(function(){ toast('Place link copied.'); }); return; } share(b.dataset.share, '📍 I left a memory for you at a spot. It opens only when you’re standing there:'); }; });
  }).catch(function(e){ document.getElementById('l').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  track('mine', {});
}

function boot(){ if (!sb) return Promise.resolve(); return sb.auth.getSession().then(function(r){ SESSION = r.data && r.data.session; return (SESSION || QA_TOKEN) ? api({ action: 'me' }).then(function(j){ ME = j.profile; }).catch(function(){ ME = null; }) : null; }); }
function tent(code){
  if (code === 'site') { var qs = qrcode(0, 'M'); qs.addData(SITE + '/myspot/'); qs.make();
    $('<div class="noprint">' + hdr() + '<div class="row"><button class="btn gold" id="pr">Print</button><button class="btn" id="cp">Copy link</button></div></div>' +
      '<div class="tent"><div class="small">MEMORIES HAVE PLACES</div><h3>Memspots</h3><img alt="QR code" style="width:260px;height:260px" src="' + qs.createDataURL(8, 0) + '"><div class="big">Leave a memory where you stand. It opens only for someone standing there.</div><div class="small">voterpup.com/myspot · no app needed</div></div>');
    document.getElementById('pr').onclick = function(){ window.print(); }; document.getElementById('cp').onclick = function(){ navigator.clipboard.writeText(SITE + '/myspot/').then(function(){ toast('Link copied.'); }); }; track('tent', { site: true }); return; }
  $('<div class="noprint">' + hdr() + '</div><div class="muted noprint">Loading…</div>');
  api({ action: 'peek', code: code }).then(function(s){
    var isPlace = s.kind === 'place'; var q = qrcode(0, 'M'); q.addData(isPlace ? placeUrl(code) : spotUrl(code)); q.make();
    $('<div class="noprint">' + hdr() + '<div class="row"><button class="btn gold" id="pr">Print</button><button class="btn" id="cp">Copy link</button></div><div class="muted">Show it on your phone, or print it.</div></div>' +
      '<div class="tent"><div class="small">' + (isPlace ? 'A NOTE FROM THE OWNER THAT ONLY OPENS HERE' : 'A NOTE THAT ONLY OPENS HERE') + '</div><h3>' + esc(isPlace ? s.place_name : (s.clue || ('A memory from ' + (s.maker_name || 'the owner')))) + '</h3>' +
      '<img alt="QR code" style="width:260px;height:260px" src="' + q.createDataURL(8, 0) + '">' +
      '<div class="big">Scan it. It opens because you’re standing here.</div><div class="small">Read the note, then leave your own in the guestbook.<br>' + esc((isPlace ? placeUrl(code) : spotUrl(code)).replace('https://', '')) + '</div></div>');
    document.getElementById('pr').onclick = function(){ window.print(); }; document.getElementById('cp').onclick = function(){ navigator.clipboard.writeText(isPlace ? placeUrl(code) : spotUrl(code)).then(function(){ toast('Link copied.'); }); };
    track('tent', {});
  }).catch(function(){ $(hdr() + '<h2>Nothing here.</h2>'); });
}
function route(){ var q = new URLSearchParams(location.search); if (q.get('qr')) tent(q.get('qr').replace(/[^a-z0-9]/g, '')); else if (q.get('demo')) demo(q.get('demo') === 'owner'); else if (q.get('at') && q.get('leave')) home(); else if (q.get('at')) place(q.get('at').replace(/[^a-z0-9]/g, '')); else if (q.get('d')) find(q.get('d').replace(/[^a-z0-9]/g, '')); else if (q.get('mine')) mine(); else if (q.get('map')) mapView(); else home(); }
window.__spot = { setQA: function(t){ QA_TOKEN = t; return boot().then(route); }, exportWall: exportWall };
boot().then(route);
if ('serviceWorker' in navigator && location.pathname.indexOf('/myspot/') === 0) navigator.serviceWorker.register('/myspot/sw.js', { scope: '/myspot/' }).catch(function(){});
</script>
