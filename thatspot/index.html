<style>
:root{--bg:#0c1722;--card:#142433;--line:#233a4e;--ink:#eaf2f8;--sub:#9fb4c6;--gold:#f5b83d;--gold2:#ffcd5e;--onGold:#1a1304;--good:#2fd39c;--bad:#ff6b80;--field:#0f1d2a;--pub:#2fd39c;--mine:#f5b83d;--shared:#b48cff;--spot1:#1d3550;--spot2:#0c1722;--spotopen1:#1f5a46;--spotline:#2a4258;--spotink:#eaf2f8;--spotsub:#b8cad8;--spothid:#4b657d;--spotmeta:#ffcd5e;--spotclue:rgba(255,255,255,.06);--badge:#0c1722;--toastbg:#eaf2f8;--toastfg:#0c1722;--mapbg:#1b2430;--mapfilter:invert(1) hue-rotate(185deg) brightness(.92) contrast(.88) saturate(.55);--vig:rgba(5,10,18,.55);--tint:rgba(245,184,61,.06);--attrbg:rgba(12,23,34,.7);color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f4ee;--card:#fff;--line:#e2ddd0;--ink:#14202c;--sub:#566778;--gold:#f5b83d;--gold2:#a8740a;--onGold:#1a1304;--good:#12865f;--bad:#c4384f;--field:#efece4;--pub:#12865f;--mine:#d9961a;--shared:#7a4fd6;--spot1:#fff;--spot2:#f3eee2;--spotopen1:#e4f6ee;--spotline:#e2ddd0;--spotink:#14202c;--spotsub:#566778;--spothid:#b7c0c9;--spotmeta:#a8740a;--spotclue:rgba(0,0,0,.05);--badge:#14202c;--toastbg:#14202c;--toastfg:#fff;--mapbg:#e8e2d4;--mapfilter:saturate(.7) sepia(.18) brightness(.9) contrast(1.06);--vig:rgba(30,25,15,.28);--tint:rgba(245,184,61,.10);--attrbg:rgba(255,255,255,.7);color-scheme:light}}
:root[data-theme="light"]{--bg:#f6f4ee;--card:#fff;--line:#e2ddd0;--ink:#14202c;--sub:#566778;--gold:#f5b83d;--gold2:#a8740a;--onGold:#1a1304;--good:#12865f;--bad:#c4384f;--field:#efece4;--pub:#12865f;--mine:#d9961a;--shared:#7a4fd6;--spot1:#fff;--spot2:#f3eee2;--spotopen1:#e4f6ee;--spotline:#e2ddd0;--spotink:#14202c;--spotsub:#566778;--spothid:#b7c0c9;--spotmeta:#a8740a;--spotclue:rgba(0,0,0,.05);--badge:#14202c;--toastbg:#14202c;--toastfg:#fff;--mapbg:#e8e2d4;--mapfilter:saturate(.7) sepia(.18) brightness(.9) contrast(1.06);--vig:rgba(30,25,15,.28);--tint:rgba(245,184,61,.10);--attrbg:rgba(255,255,255,.7);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 17px/1.45 Nunito,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
.logo{font:700 21px Fredoka,sans-serif;color:var(--gold);text-decoration:none}
.lnk{font:800 14px Nunito;color:var(--sub);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;background:none;border:0;cursor:pointer}
.me{display:flex;align-items:center;gap:4px}.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}

.lead{color:var(--sub);margin:0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:transparent;font-weight:900;font-size:16.5px;padding:12px 16px;text-decoration:none;color:var(--ink);cursor:pointer;width:100%}

.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font:900 15px Nunito;flex:none;margin-top:2px}
.step .n.done{background:var(--good);color:#05261c}
.step>div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.step .t{font-weight:900;font-size:16px}
.muted{color:var(--sub);font-size:14px}
.foot{font-size:12.5px;color:var(--sub);text-align:center}
.in{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16.5px;font-weight:700;outline:none;min-height:50px}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:96px;resize:vertical;line-height:1.35}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;min-height:44px;font-weight:900;font-size:13.5px;color:var(--sub);cursor:pointer;padding:6px 4px}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line)}
.map{width:100%;height:200px;border-radius:14px;border:1px solid var(--line);background:#0f1d2a}
.map.big{height:calc(100vh - 230px);min-height:380px;position:relative}
.locbtn{position:absolute;right:12px;bottom:28px;z-index:800;width:48px;height:48px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}.locbtn.on{color:#4ea3ff;border-color:#4ea3ff}.locbtn svg{width:22px;height:22px}
.leaflet-container{font:inherit;background:var(--mapbg)}
.map{position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.map .leaflet-tile-pane{filter:var(--mapfilter)}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:450;border-radius:inherit;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,var(--vig) 100%),linear-gradient(180deg,var(--tint),transparent 30%)}
.leaflet-control-attribution{background:var(--attrbg)!important;color:var(--sub)!important;font-size:10px!important;border-radius:8px 0 0 0}.leaflet-control-attribution a{color:var(--sub)!important}
.pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.deck{position:relative;width:34px;height:34px}.deck i{position:absolute;left:0;top:0;width:26px;height:34px;border-radius:5px;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);background:var(--pub)}.deck i.c2{transform:translate(4px,-3px) rotate(6deg);opacity:.9}.deck i.c3{transform:translate(8px,-6px) rotate(12deg);opacity:.8}.deck i.public{background:var(--pub)}.deck i.mine{background:var(--mine)}.deck i.shared{background:var(--shared)}.deck i.place{background:#ff8c42}.deck b{position:absolute;right:-8px;bottom:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--badge);color:#fff;border:2px solid #fff;font:900 11px/16px Nunito;text-align:center;padding:0 4px}.deck .ph{position:absolute;left:5px;top:9px;font-size:13px}
.shoppin{width:44px;height:44px;border-radius:50%;border:3px solid #ff8c42;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4);overflow:hidden;display:grid;place-items:center;color:#ff8c42}.shoppin img,.leaflet-container .leaflet-marker-pane .shoppin img{width:44px!important;height:44px!important;max-width:none;object-fit:cover;display:block}.shoppin svg{width:22px;height:22px}
.shoplogo{width:56px;height:56px;border-radius:14px;object-fit:cover;border:2px solid #ff8c42;flex:none}
.deck .shp{position:absolute;left:0;top:0;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}.deck .shp.card{width:26px;height:34px;border-radius:5px}.deck .shp.coin{width:28px;height:28px;border-radius:50%;top:4px}.deck .shp.env{width:32px;height:24px;border-radius:4px;top:8px;overflow:hidden}.deck .shp.env span{position:absolute;left:-1px;right:-1px;top:-14px;height:26px;border-bottom:1.5px solid rgba(255,255,255,.9);transform:skewY(0);clip-path:polygon(0 0,100% 0,50% 100%);background:rgba(0,0,0,.15)}.deck .shp.d1{transform:translate(4px,-3px) rotate(6deg);opacity:.9}.deck .shp.d2{transform:translate(8px,-6px) rotate(12deg);opacity:.8}
.deck{transform:scale(var(--ms,1));transform-origin:13px 34px;transition:transform .15s}.shoppin{transform:scale(calc(var(--ms,1) + .15));transform-origin:22px 44px;transition:transform .15s}.far .deck b,.far .deck .ph{display:none}
.pin.place{background:#ff8c42;border-radius:6px;transform:rotate(45deg);width:20px;height:20px}
.pin.public{background:var(--pub)}.pin.mine{background:var(--mine)}.pin.shared{background:var(--shared)}.pin.here{background:#4ea3ff;border-radius:50%;transform:none;width:16px;height:16px}
.counts{display:flex;gap:8px;flex-wrap:wrap}.counts span{display:inline-flex;align-items:center;gap:6px;font:800 13px Nunito;color:var(--sub)}.counts i{width:10px;height:10px;border-radius:50%;display:inline-block}
.spot{position:relative;border-radius:22px;padding:20px 18px 16px;background:linear-gradient(160deg,var(--spot1),var(--spot2));border:1px solid var(--spotline);color:var(--spotink);display:flex;flex-direction:column;gap:10px}
.spot.open{background:linear-gradient(160deg,var(--spotopen1),var(--spot2));border-color:var(--pub)}
.spot .who{display:flex;align-items:center;gap:9px;font:800 13.5px Nunito;color:var(--spotsub)}.spot .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #f5b83d}
.spot .pinbadge{position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:50%;background:#f5b83d;display:grid;place-items:center;font-size:20px}
.spot .body{font:600 22px/1.25 Fredoka,sans-serif;text-wrap:balance;white-space:pre-wrap}
.spot .hid{font:600 22px/1.25 Fredoka,sans-serif;letter-spacing:.14em;color:var(--spothid);filter:blur(2px);user-select:none}
.spot .clue{font:700 15px/1.4 Nunito;background:var(--spotclue);border-radius:12px;padding:10px 12px}
.spot .meta{font:900 12.5px Nunito;letter-spacing:.08em;text-transform:uppercase;color:var(--spotmeta)}
.spot img.ph{width:100%;border-radius:14px;max-height:360px;object-fit:cover}
.dist{font:600 44px/1 Fredoka,sans-serif}
.log{display:flex;flex-direction:column;gap:8px}.log div{background:var(--field);border-radius:12px;padding:10px 12px;font-size:14.5px}.log small{display:block;color:var(--sub);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.item b{display:block;font-size:15px}.item small{color:var(--sub);font-size:12.5px}
select.in{min-height:44px;padding:8px 10px;font-size:14px;width:auto}
.ic{width:1.1em;height:1.1em;vertical-align:-0.18em;display:inline-block}
.secure{font:800 12px Nunito;color:var(--good);display:flex;align-items:center;gap:5px;justify-content:center}
.hidden{display:none!important}
.err{color:var(--bad);font-size:14px;font-weight:800}
#gslot{min-height:44px;display:flex;justify-content:center}
.tent{background:#fff;color:#14202c;border-radius:0;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border:1px dashed #999}
.tent h3{font:700 30px/1.1 Fredoka,sans-serif;margin:0}
.tent .big{font:700 22px/1.2 Fredoka,sans-serif}
.tent .small{font:700 14px Nunito;color:#566778}
@media print{body{background:#fff}.app{padding:0;max-width:none}.noprint{display:none!important}.tent{border:0;min-height:95vh;justify-content:center}}
/* ---- the memory wall ---- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;background:linear-gradient(160deg,var(--spot1),var(--spot2));border:1px solid var(--spotline);display:flex;flex-direction:column;gap:10px}
.hero .top2{display:flex;gap:12px;align-items:center}
.hero .lg{width:64px;height:64px;border-radius:18px;object-fit:cover;border:2px solid var(--gold);flex:none;background:var(--field)}
.hero .lg.ph{display:grid;place-items:center;color:var(--gold)}.hero .lg.ph svg{width:30px;height:30px}
.hero h1{font-size:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;font:800 12.5px Nunito;color:var(--sub);background:var(--field);border:1px solid var(--line);border-radius:999px;padding:5px 10px}.chip b{color:var(--ink)}
.hint{color:var(--sub);font:600 14.5px/1.45 Nunito}.hint .lnk{font-size:14.5px}.note.ph{border:1.5px dashed var(--spotline);background:transparent}.note.ph .body{color:var(--sub);font-weight:500}
.note{background:var(--spotclue);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}.note .k{font-size:11.5px}.note .body{font:600 19px/1.3 Fredoka,sans-serif;white-space:pre-wrap}.note img{width:100%;border-radius:12px;max-height:280px;object-fit:cover}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font:900 13.5px Nunito;color:var(--sub);cursor:pointer;min-height:40px}.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}.sec .k{font-size:12px}.sec small{color:var(--sub);font-weight:800;font-size:12px}
.wall{columns:2;column-gap:10px}.wall.one{columns:1}
.app.hasfab{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.mc{break-inside:avoid;margin:0 0 10px;position:relative;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.14);animation:rise .35s ease both}
.mc:active{transform:scale(.985)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mc img.p{width:100%;display:block;background:var(--field);min-height:90px}
.mc .cap{font:600 14.5px/1.35 Nunito;padding:10px 12px 0;white-space:pre-wrap}
.mc.paper{background:#fff4c2;color:#1d2433;border:0}.mc.paper.b{background:#dff5ea}.mc.paper.c{background:#e8ddff}.mc.paper.d{background:#ffe1d6}
.mc.paper .tx{font:600 18px/1.28 Fredoka,sans-serif;padding:16px 14px 4px;white-space:pre-wrap;text-wrap:pretty}
.mc .ft{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;font:800 11.5px Nunito;color:var(--sub);min-width:0}.mc.paper .ft{color:#5a6472}
.mc .ft img{width:20px;height:20px;border-radius:50%;flex:none}.mc .ft .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:inherit;font:900 12.5px Nunito;padding:4px 6px;border-radius:999px;cursor:pointer;flex:none;min-height:30px}.heart svg{width:18px;height:18px;transition:transform .2s}.heart.on{color:#ff4d6d}.heart.on svg{fill:#ff4d6d;stroke:#ff4d6d}.heart.pop svg{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.pinbadge2{position:absolute;left:8px;top:8px;z-index:2;background:var(--gold);color:var(--onGold);font:900 10.5px Nunito;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.mc .oact{display:flex;gap:6px;padding:0 10px 10px}.mc .oact .icb{flex:1;justify-content:center;min-height:34px;font-size:12px;padding:0 8px}.mc.paper .oact .icb{border-color:rgba(0,0,0,.18);color:#1d2433}.mc.paper .oact .icb.on{color:var(--onGold);border-color:var(--gold)}
.mc.hid img.p,.mc.hid .tx,.mc.hid .cap,.mc.hid .ft{opacity:.4}.pinbadge2.hid{left:auto;right:8px;background:#4b657d;color:#fff}

.sk{break-inside:avoid;margin:0 0 10px;border-radius:18px;background:linear-gradient(90deg,var(--field) 25%,var(--card) 50%,var(--field) 75%);background-size:200% 100%;animation:sh 1.2s infinite;height:140px}.sk.t{height:96px}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.empty{column-span:all;text-align:center;color:var(--sub);padding:28px 12px;border:2px dashed var(--line);border-radius:18px;margin-bottom:10px}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:900;display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--onGold);font:900 15px Nunito;padding:14px 18px;border-radius:999px;text-decoration:none;box-shadow:0 10px 28px rgba(0,0,0,.35);border:0;cursor:pointer}
.fab svg{width:20px;height:20px}

.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px;font:800 13px Nunito;color:#b8cad8}.lb .x{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}

function b64u(bytes){ var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }

function googleButton(slot, after){

  '<div class="muted" style="text-align:center">or</div><div id="eslot"><div class="row"><input id="oem" class="in" type="email" placeholder="you@email.com" autocomplete="email"><button class="btn" id="osend" style="flex:0 0 auto;width:auto;min-width:110px">Send code</button></div><div class="err hidden" id="oerr"></div></div></div>'; }

    }).catch(function(e){ err.textContent = 'Could not send the code: ' + e.message; err.classList.remove('hidden'); b.disabled = false; b.textContent = 'Send code'; });

function toggleHeart(c, send){   // optimistic; `send(on)` does the real call and resolves {hearts}

      '<div class="stage" id="lbs">' + (c.photo_url ? '<img src="' + esc(c.photo_url) + '" alt="">' : '<div class="paper2">' + esc(c.body || '') + '</div>') + (cards.length > 1 ? '<button class="nav l" id="lbl" aria-label="Previous">‹</button><button class="nav r" id="lbr" aria-label="Next">›</button>' : '') + '</div>' +
