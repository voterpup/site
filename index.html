  *{box-sizing:border-box} html,body{margin:0}

  /* ceremony — squash & stretch, staged */

  if (!getPlace() || placeIsManual() || !placeStale() || !navigator.permissions) return;
  navigator.permissions.query({ name: 'geolocation' }).then(function(st){
    if (st.state !== 'granted') return;             // never surprise-prompt
    var before = getPlace();
    detectPlace(function(p){ if (p && p !== before) renderVoteStrip(); });
  }).catch(function(){});
}
function osmLabel(ad){
  var city = ad.city || ad.town || ad.village || ad.municipality || ad.county || '';
  var region = ad.state || ad.province || ad.region || '';
  return [city, region, ad.country || ''].filter(Boolean).join(', ');
}
function savePlace(place, manual){
  try {
    localStorage.setItem('vp.place', place);
    localStorage.setItem('vp.place_ts', String(Date.now()));
    if (manual) localStorage.setItem('vp.place_manual', '1'); else localStorage.removeItem('vp.place_manual');
  } catch (e) {}
}
function placeIsManual(){ try { return localStorage.getItem('vp.place_manual') === '1'; } catch (e) { return false; } }
function detectPlace(cb){
  if (!navigator.geolocation) { cb(null); return; }
  navigator.geolocation.getCurrentPosition(function(pos){
    fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=en&email=hi%40voterpup.com&lat=' +
          pos.coords.latitude + '&lon=' + pos.coords.longitude)
      .then(function(r){ return r.json(); })
      .then(function(g){
        var place = osmLabel(g.address || {});
        if (!place) { cb(null); return; }
        savePlace(place, false);
        cb(place);
      }).catch(function(){ cb(null); });
  }, function(){ cb(null); }, { timeout: 8000 });
}

function renderVoteStrip(){
  var el = document.getElementById('votestrip'); if (!el) return;

    el.innerHTML = '<div class="votestrip" style="display:flex;align-items:center;gap:8px">📍 <b>Find your next election</b><span class="days" id="findloc" style="cursor:pointer;margin-left:auto">use my location</span><a href="#" class="chgloc" style="font-size:12px;color:#3b6fb6;white-space:nowrap">or type a city</a></div>';
    document.getElementById('findloc').onclick = function(){
      el.innerHTML = '📍 sniffing around...';
      detectPlace(function(p){ renderVoteStrip(); });
    };
    return;
  }
  rpc('vp_upcoming', { p_place: place }).then(function(list){
    if (!list || !list.length) {
      var city = esc(place.split(',')[0]);
      var chg = ' <a href="#" class="chgloc" style="color:#3b6fb6;white-space:nowrap">change place</a>';
      el.innerHTML = '<div class="votestrip">🔎 Looking up votes in <b>' + city + '</b>…' + chg + '</div>';
      notePlace(place).then(function(s){
        if (getPlace() !== place || !document.getElementById('votestrip')) return;
        var st = s && s.status;
        if (st === 'checked') {
          el.innerHTML = '<div class="votestrip">🗳️ No votes on file for <b>' + city + '</b> yet' +
            (s.last_checked ? ' · checked ' + new Date(s.last_checked).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '') + chg + '</div>';
          addOffices(el, place);
          return;
        }
        el.innerHTML = '<div class="votestrip">🔎 New place. Checking official sources for <b>' + city + '</b>' +
          (st === 'busy' ? ' · busy today, a few hours' : ' · a few minutes, updates itself') + chg + '</div>';
        clearTimeout(_placePoll);
        var tries = 0;
        (function poll(){
          _placePoll = setTimeout(function(){
            if (getPlace() !== place || !document.getElementById('votestrip')) return;
            rpc('vp_upcoming', { p_place: place }).then(function(l2){
              if (l2 && l2.length) { renderVoteStrip(); return; }
              if (++tries < 12) { poll(); return; }

          }, 45000);
        })();
      });
      return;
    }
    notePlace(place);
    addOffices(el, place);
    mountMoments(el, list, true, 'When you can act · 📍 ' + esc(place.split(',')[0]) + ' · <a href="#" class="chgloc" style="color:#3b6fb6;text-transform:none">change</a>');
  }).catch(function(){ el.innerHTML = ''; });

var _elCache = {};
function fillEntryElections(){
  var chips = document.querySelectorAll('[data-eplace]');
  var byKey = {};
  Array.prototype.forEach.call(chips, function(c){
    var k = c.getAttribute('data-eplace') + '||' + (c.getAttribute('data-etopic') || '');
    (byKey[k] = byKey[k] || []).push(c);
  });
  Object.keys(byKey).forEach(function(k){
    var parts = k.split('||'), p = parts[0], t = parts[1] || null;
    var apply = function(e){
      byKey[k].forEach(function(c){
        var base = '📍 ' + esc(p.split(',')[0]);
        if (!e) { c.innerHTML = base; return; }
        var cls = e.kind === 'election' ? 'dred' : (e.kind === 'voice' ? 'dblue' : 'dgreen');
        c.innerHTML = base + ' · <span class="' + cls + '">🗳️ ' +
          (e.days === 0 ? 'today' : e.days + 'd') + '</span>';
        c.title = e.name;
      });
    };
    if (k in _elCache) { apply(_elCache[k]); return; }
    rpc('vp_find_moment', { p_place: p, p_topic: t }).then(function(e){ _elCache[k] = e; apply(e); }).catch(function(){});
  });
}

function groupedQuestionsRow(qs){

function momentTiles(list, groupDecisions){
  var items = [], byDate = {}, voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; items.push({ qd: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else items.push({ e: e });
  });
  var tiles = items.map(function(it){
    if (it.qd) {
      var qs = byDate[it.qd], seen = {}, links = [];
      qs.forEach(function(q){ (q.actions || []).forEach(function(a){ if (!seen[a.url]) { seen[a.url] = 1; links.push(a); } }); });
      return { cls: 'green', kind: 'Ballot questions', days: qs[0].days,
        title: qs.length + ' question' + (qs.length === 1 ? '' : 's') + ' on your ballot',
        body: qs.map(function(q){ return '<div class="qname">' + esc(q.name) + '</div>' + (q.how ? '<div>' + esc(q.how) + '</div>' : ''); }).join('') +
              '<div>' + actionLinks(links) + '</div>' };
    }
    var e = it.e;
    if (e.estimated) return { cls: 'red est', kind: 'Election · estimated', days: e.days, est: true, title: e.name,
      body: '<b>' + esc(e.name) + '</b>\n<i>Estimated: ' + esc(e.estimate_note || 'no date announced yet') +
            '. Official sources say when it&rsquo;s due, but no date is set yet. We&rsquo;ll replace this with the real date.</i>\n' + momentBody(e) };
    return { cls: e.kind === 'election' ? 'red' : (e.kind === 'voice' ? 'blue' : 'green'),
      kind: e.kind === 'election' ? 'Election' : (e.kind === 'voice' ? 'Have your say' : 'Ballot question'),
      days: e.days, title: e.name, body: '<b>' + esc(e.name) + '</b>\n' + momentBody(e) };
  });
  if (voice.length) tiles.push({ cls: 'blue', kind: 'Have your say', days: voice[0].days,
    title: (voice.length >= 40 ? '40+' : voice.length) + ' open consultation' + (voice.length === 1 ? '' : 's'),
    body: '<div>Anyone can comment — you don’t need to be a citizen or a voter.</div>' + voiceItems(voice, groupDecisions ? 8 : 12) });
  return tiles;
}
function mountMoments(el, list, groupDecisions, heading){

    tiles.map(function(t, i){
      return '<div class="mtile ' + t.cls + '" data-mi="' + i + '"><div class="mk">' + t.kind + '</div>' +
        '<div class="md">' + (t.est ? '~' + Math.max(1, Math.round(t.days / 30.4)) + '<small> months</small>'
          : t.days === 0 ? 'TODAY' : t.days + '<small> day' + (t.days === 1 ? '' : 's') + '</small>') + '</div>' +
        '<div class="mn">' + esc(t.title) + '</div></div>';
    }).join('') + '</div><div class="mpanel" hidden></div>';
  var panel = el.querySelector('.mpanel');
  Array.prototype.forEach.call(el.querySelectorAll('.mtile'), function(tile){
    tile.onclick = function(){
      var i = +tile.getAttribute('data-mi'), was = tile.classList.contains('on');

  });

function renderMoments(list, groupDecisions){
  var out = [], byDate = {}, order = [], voice = [];
  list.forEach(function(e){
    if (e.kind === 'voice') { voice.push(e); return; }
    if (groupDecisions && e.kind === 'decision') {
      if (!byDate[e.vote_date]) { byDate[e.vote_date] = []; order.push({ q: e.vote_date }); }
      byDate[e.vote_date].push(e);
    } else order.push(e);
  });
  order.forEach(function(r){ out.push(r.q ? groupedQuestionsRow(byDate[r.q]) : momentRow(r)); });

// Interactive first-run tour: spotlights the real controls on the pup page, one at a time.
// The spotlighted control stays tappable; everything else is dimmed. Replay from Manage pup.
function startTour(name, k0){
  var nm = esc(name);
  var steps = [
    { sel: '#huntcard', text: '<b>Today&rsquo;s sniff challenge.</b> Find these 5 things and feed ' + nm + ' a photo of each. Every find is worth more points.' },
    { sel: '#tab-city', text: '<b>Your city.</b> What everyone near you wants fixed, ranked by how many agree. Tap &ldquo;same here&rdquo; on yours.' },
    { sel: '#flashbtn', text: '<b>Memory Lane.</b> Everything ' + nm + ' remembers, walked back to you, and ready on the morning you vote.', last: true }
  ].filter(function(s){ return document.querySelector(s.sel); });
  if (!steps.length) return;
  var k = Math.min(k0 || 0, steps.length - 1);
  window._tourEnd = function(){ end(true); };
  var dim = document.createElement('div'); dim.className = 'tourdim';
  var hole = document.createElement('div'); hole.className = 'tourhole';
  var tip = document.createElement('div'); tip.className = 'tourtip';
  document.body.appendChild(dim); document.body.appendChild(hole); document.body.appendChild(tip);
  function end(quiet){
    [dim, hole, tip].forEach(function(x){ if (x.parentNode) x.parentNode.removeChild(x); });
    window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true); window._tourEnd = null;
    try { localStorage.setItem('vp.toured', '1'); } catch (e) {}
    if (quiet) return;
    var s0 = loadLocal(); var asked = false; try { asked = !!localStorage.getItem('vp.remasked'); } catch (e) {}
    if (s0 && !KIOSK) setTimeout(function(){ permsSheet(s0.tail, s0.name); }, 300);
  }
  function place(){
    var s = steps[k], el = document.querySelector(s.sel);
    if (!el) { end(); return; }
    var r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = 'top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + 2 * pad) + 'px;height:' + (r.height + 2 * pad) + 'px';
    var th = tip.offsetHeight, vh = window.innerHeight;
    var below = r.bottom + 12 + th < vh - 8 && (r.top + r.height / 2 < vh / 2 || r.top - 12 - th < 8);
    var top = below ? r.bottom + 12 : r.top - 12 - th;
    tip.style.top = Math.max(8, Math.min(top, vh - th - 8)) + 'px';
  }
  function show(){
    var s = steps[k], el = document.querySelector(s.sel);
    tip.innerHTML = '<div class="tourtxt">' + s.text + '</div><div class="tourrow"><span>' + (k + 1) + ' / ' + steps.length + '</span>' +
      '<a href="#" id="tskip">Skip</a>' + (k ? '<button class="tbtn ghost" id="tback">Back</button>' : '') +
      '<button class="tbtn" id="tnext">' + (s.last ? 'Got it' : 'Next') + '</button>' + '</div>';
    if (!el.closest('.tabbar')) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    requestAnimationFrame(function(){ requestAnimationFrame(place); });
    document.getElementById('tskip').onclick = function(ev){ ev.preventDefault(); end(); };
    document.getElementById('tnext').onclick = function(){ if (s.last) end(); else { k++; show(); } };
    var b = document.getElementById('tback'); if (b) b.onclick = function(){ k--; show(); };
    var m = document.getElementById('tman'); if (m) m.onclick = function(){ end(); location.href = '/manage'; };
  }
  // tapping the spotlighted control itself ends the tour and lets it do its job
  hole.onclick = function(){ var el = document.querySelector(steps[k].sel); end(); if (el) (el.querySelector('textarea') || el).click(); };
  window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
  show();
}

function sha256hex(str){

    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
  });
}

// ---------- Pup Patrol: smash today's real issues of the called topic. Awareness only: taps never count as "same here". ----------
var TOPIC_EMOJI = { housing: '🏠', homelessness: '⛺', transit: '🚌', infrastructure: '🚧', utilities: '💡', safety: '🚨', 'cost of living': '💸', health: '🏥', education: '🎒', climate: '🌡️', cleanliness: '🧹', parks: '🌳', other: '📌' };
var PATROL_DEMO = [{ body: 'Overflowing bin at the bus loop', topic: 'cleanliness' }, { body: 'Pothole on 4th Ave', topic: 'infrastructure' }, { body: 'Bus 99 full again', topic: 'transit' },
  { body: 'Graffiti on the seawall', topic: 'cleanliness' }, { body: 'Street light out on Main', topic: 'infrastructure' }, { body: 'Rent up 18%', topic: 'housing' },
  { body: 'Litter after the market', topic: 'cleanliness' }, { body: 'No shade at the playground', topic: 'parks' }, { body: 'Crosswalk light too short', topic: 'safety' },
  { body: 'Dog poop on the path', topic: 'cleanliness' }, { body: 'Train late every morning', topic: 'transit' }, { body: 'Broken bench by the water', topic: 'parks' }];
function patrolPool(){
  return prefetchDeck().then(function(rows){
    var day = Date.now() - 864e5, pool = [];
    (rows || []).forEach(function(r){ if (r.body && r.topic && r.topic !== 'other') pool.push({ id: r.id, body: r.body, topic: r.topic, pup: r.pup, fresh: new Date(r.ts) > day, backs: r.backs || 0 }); });
    pool.sort(function(a, b){ return (b.fresh - a.fresh); });
    (window._cityPins || []).slice(0, 40).forEach(function(c){ if (c.topic && c.topic !== 'other') pool.push({ body: c.type.replace(/ Case$/, '') + (c.area ? ' · ' + c.area : ''), topic: c.topic, city: true }); });
    var seen = {}, out = pool.filter(function(x){ var k = x.body.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true; });
    return out.length >= 8 ? out.slice(0, 40) : out.concat(PATROL_DEMO).slice(0, 40);
  });
}
function screenPlay(){
  var s = loadLocal(), nm = s ? esc(s.name) : 'The pup', city = getPlace() ? esc(getPlace().split(',')[0]) : 'your city';
  root.innerHTML = nav() + '<div class="game"><div class="gtop"><b>🎯 Pup Patrol</b><a href="/pack" class="gx">✕</a></div><div class="hint" style="padding:30px 0">Fetching today&rsquo;s issues…</div></div>' + tabbar('pack');
  wireTabs();
  patrolPool().then(function(pool){
    var g = document.querySelector('.game');
    var counts = {}; pool.forEach(function(x){ counts[x.topic] = (counts[x.topic] || 0) + 1; });
    var topics = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; });
    var level = 1, score = 0, bar = 30, met = {}, timer = null, popT = null, target = topics[0], left = 30, bonus = false, best = +(localStorage.getItem('vp.patrolbest') || 0);
    function intro(){
      g.innerHTML = '<div class="gtop"><b>🎯 Pup Patrol</b><a href="/pack" class="gx">✕</a></div>' +
        '<div class="gintro"><div class="gbig">' + nm + ' needs a hand.</div><p>Today&rsquo;s real issues in ' + city + ' pop up, each with its topic colour and icon. <b>Smash the ones that match the called topic.</b> Wrong smash or a missed one drains the Fix-it bar. Fill it before the clock runs out.</p>' +
        '<div class="glegend">' + TOPIC_LIST.filter(function(t){ return t !== 'other'; }).map(function(t){ return '<span style="background:' + TILE_COLORS[TOPIC_LIST.indexOf(t) % TILE_COLORS.length] + '">' + TOPIC_EMOJI[t] + ' #' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<p class="hint" style="text-align:left">30 seconds · ' + pool.length + ' issues in play' + (best ? ' · your best: ' + best : '') + '</p>' +
        '<button class="btn gold" id="gstart">Start level 1</button></div>';
      document.getElementById('gstart').onclick = function(){ level = 1; score = 0; met = {}; start(); };
    }
    function callout(txt, colour, ms, then){
      var old = document.getElementById('gcall'); if (old) old.parentNode.removeChild(old);
      var d = document.createElement('div'); d.id = 'gcall'; d.className = 'gcall'; d.style.setProperty('--c', colour);
      d.innerHTML = txt; (document.querySelector('.ggrid') || g).appendChild(d);
      setTimeout(function(){ d.classList.add('out'); setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); if (then) then(); }, 350); }, ms);
    }
    function targetCall(ms, then){
      callout('<small>Smash the</small>' + (TOPIC_EMOJI[target] || '📌') + '<b>#' + esc(target) + '</b>', TILE_COLORS[(TOPIC_LIST.indexOf(target) + 13) % TILE_COLORS.length], ms, then);
    }
    function hud(){
      var tg = document.getElementById('gtarget'), tm = document.getElementById('gtime'), sc = document.getElementById('gscore'), bf = document.getElementById('gbarfill');
      if (tg) tg.innerHTML = bonus ? '✅ BONUS: smash every <b>Fixed now</b>!' : 'Smash the <span class="gsw" style="background:' + TILE_COLORS[(TOPIC_LIST.indexOf(target) + 13) % TILE_COLORS.length] + '">' + (TOPIC_EMOJI[target] || '📌') + '</span> <b>#' + esc(target) + '</b> ones';
      if (tm) tm.textContent = left + 's'; if (sc) sc.textContent = score;
      if (bf) { bf.style.width = Math.max(0, Math.min(100, bar)) + '%'; bf.className = bar < 30 ? 'low' : bar > 75 ? 'high' : ''; }
    }
    function start(){
      bonus = false; bar = 30; left = 30;
      if (level === 2) target = topics[1] || topics[0];
      g.innerHTML = '<div class="gtop"><span id="gtarget"></span><a href="#" class="gx" id="gquit">✕</a></div>' +
        '<div class="ghud"><span>⏱ <b id="gtime"></b></span><span>Level ' + level + '</span><span>⭐ <b id="gscore">0</b></span></div>' +
        '<div class="gbar"><div id="gbarfill"></div><span>Fix-it bar</span></div>' +
        '<div class="ggrid">' + '<div class="hole"></div>'.repeat(9) + '</div><div class="ghint">tap the right ones · wrong or missed drains the bar</div>';
      document.getElementById('gquit').onclick = function(ev){ ev.preventDefault(); stop(); intro(); };
      hud();
      var speed = level === 1 ? 1000 : 800, paused = true;
      function run(){
        paused = false;
        timer = setInterval(function(){ left--;
          if (level === 2 && left % 10 === 0 && left > 0) {
            target = topics[(topics.indexOf(target) + 1) % Math.min(topics.length, 3)]; hud();
            paused = true; Array.prototype.forEach.call(document.querySelectorAll('.mole'), function(x){ x.classList.add('gone'); });
            if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
            targetCall(900, function(){ paused = false; });
          }
          hud(); if (left <= 0) { stop(); finish(false); } }, 1000);
      }
      (function loop(){ popT = setTimeout(function(){ if (!paused) { pop(); speed = Math.max(level === 1 ? 650 : 520, speed - 10); } loop(); }, speed); })();
      targetCall(1500, run);   // the target sits in the centre first, then fades and the round starts
    }
    function stop(){ clearInterval(timer); clearTimeout(popT); Array.prototype.forEach.call(document.querySelectorAll('.hole'), function(hh){ hh.innerHTML = ''; }); }
    function pop(){
      var holes = document.querySelectorAll('.hole'); if (!holes.length) return;
      var free = Array.prototype.filter.call(holes, function(hh){ return !hh.firstChild; }); if (!free.length) return;
      var hole = free[Math.floor(Math.random() * free.length)];
      var it;
      if (bonus) it = { body: 'Fixed now', topic: '__fixed', golden: true };
      else { var wantRight = Math.random() < 0.55; var cand = pool.filter(function(x){ return (x.topic === target) === wantRight; }); it = cand[Math.floor(Math.random() * cand.length)] || pool[0]; }
      var m = document.createElement('div'); m.className = 'mole' + (it.golden ? ' golden' : ''); m.style.setProperty('--c', it.golden ? '#e8b84b' : TILE_COLORS[(TOPIC_LIST.indexOf(it.topic) + 13) % TILE_COLORS.length]);
      m.innerHTML = '<span class="memo">' + (it.golden ? '✅' : (TOPIC_EMOJI[it.topic] || '📌')) + '</span><span class="mtxt">' + esc(it.golden ? 'Fixed now' : it.body.slice(0, 34)) + (it.city ? ' 🏛️' : '') + '</span>';
      var live = true;
      m.onpointerdown = function(ev){ ev.preventDefault(); if (!live) return; live = false;
        var ok = it.golden || it.topic === target;
        if (ok) { score += it.golden ? 20 : 10; bar += it.golden ? 6 : 8; m.classList.add('hit'); if (it.id || it.city) met[it.body] = it; }
        else { score = Math.max(0, score - 5); bar -= 10; m.classList.add('miss'); if (navigator.vibrate) navigator.vibrate(40); }
        hud(); setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, 220);
        if (bar >= 100 && !bonus) { stop(); bonusRound(); }
      };
      hole.appendChild(m);
      setTimeout(function(){ if (live && m.parentNode) { live = false; if (!bonus && it.topic === target) { bar -= 4; hud(); } m.classList.add('gone'); setTimeout(function(){ if (m.parentNode) m.parentNode.removeChild(m); }, 200); } }, bonus ? 900 : (level === 1 ? 1700 : 1300));
    }
    function bonusRound(){
      bonus = true; left = 10; hud();
      var tg = document.getElementById('gtarget'); if (tg) tg.innerHTML = '✅ BONUS: smash every <b>Fixed now</b>!';
      callout('<small>Bonus round</small>✅<b>Fixed now</b>', '#e8b84b', 1100, function(){
        timer = setInterval(function(){ left--; hud(); if (left <= 0) { stop(); finish(true); } }, 1000);
        (function loop(){ popT = setTimeout(function(){ pop(); loop(); }, 420); })();
      });
    }
    function finish(done){
      if (score > best) { best = score; try { localStorage.setItem('vp.patrolbest', String(best)); } catch (e) {} }
      track('play', { level: level, done: done, score: score });
      var list = Object.keys(met).map(function(k){ return met[k]; });
      g.innerHTML = '<div class="gtop"><b>' + (done ? '🏆 Level ' + level + ' cleared!' : '⏱ Time&rsquo;s up') + '</b><a href="/pack" class="gx">✕</a></div>' +
        '<div class="gend"><div class="gbig">' + score + ' points' + (score >= best && score > 0 ? ' · new best' : '') + '</div>' +
        (srcTag() === 'booth' ? '<div class="gprize">' + (done && level === 2 ? '🎁 Level 2 cleared' : done ? '🍫 Level 1 cleared' : '🍭 Played') + '<small>show this at the table</small></div>' : '') +
        '<p>You met <b>' + list.length + '</b> real issue' + (list.length === 1 ? '' : 's') + ' in ' + city + ' today.</p>' +
        '<div class="gmet">' + list.slice(0, 10).map(function(x){ return '<div class="card"><div class="entry-body">' + esc(x.body) + '</div><div class="chips">' +
          '<span class="topicchip">#' + esc(x.topic) + '</span>' + (x.city ? '<span class="chip" style="cursor:default">🏛️ city 3-1-1 report</span>' : sameChip(x.id, x.backs, false, false)) + '</div></div>'; }).join('') + '</div>' +
        (done && level === 1 ? '<button class="btn gold" id="gnext">Level 2: the target keeps changing →</button>' : '<button class="btn gold" id="gagain">Play again</button>') +
        '<a href="/pack" class="rpskip">Back to Your city · new things every day</a></div>';
      var nx = document.getElementById('gnext'); if (nx) nx.onclick = function(){ level = 2; score = 0; start(); };
      var ag = document.getElementById('gagain'); if (ag) ag.onclick = function(){ score = 0; met = {}; start(); };
    }
    intro();
  });
}
