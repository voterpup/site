<style>
:root{--bg:#0c1722;--card:#142433;--line:#233a4e;--ink:#eaf2f8;--sub:#9fb4c6;--gold:#f5b83d;--gold2:#ffcd5e;--onGold:#1a1304;--good:#2fd39c;--bad:#ff6b80;--field:#0f1d2a;--pub:#2fd39c;--mine:#f5b83d;--shared:#b48cff;color-scheme:dark}
@media (prefers-color-scheme: light){:root{--bg:#f6f4ee;--card:#fff;--line:#e2ddd0;--ink:#14202c;--sub:#566778;--gold:#f5b83d;--gold2:#a8740a;--onGold:#1a1304;--good:#12865f;--bad:#c4384f;--field:#efece4;--pub:#12865f;--mine:#d9961a;--shared:#7a4fd6;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:600 17px/1.45 Nunito,system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:8px}
.logo{font:700 21px Fredoka,sans-serif;color:var(--gold);text-decoration:none}
.lnk{font:800 14px Nunito;color:var(--sub);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 8px;background:none;border:0;cursor:pointer}
.me{display:flex;align-items:center;gap:4px}.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
h1{font:600 32px/1.08 Fredoka,sans-serif;margin:0;text-wrap:balance}
h2{font:600 24px/1.15 Fredoka,sans-serif;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:0}
.k{font:900 12.5px Nunito;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:transparent;font-weight:900;font-size:16.5px;padding:12px 16px;text-decoration:none;color:var(--ink);cursor:pointer;width:100%}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onGold)}
.btn.sm{min-height:44px;font-size:14px;padding:8px 12px;width:auto}
.btn:disabled{opacity:.5}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--onGold);display:grid;place-items:center;font:900 15px Nunito;flex:none;margin-top:2px}
.step .n.done{background:var(--good);color:#05261c}
.step>div:last-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.step .t{font-weight:900;font-size:16px}
.muted{color:var(--sub);font-size:14px}
.foot{font-size:12.5px;color:var(--sub);text-align:center}
.in{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px;font-size:16.5px;font-weight:700;outline:none;min-height:50px}
.in:focus{border-color:var(--gold)}
textarea.in{min-height:96px;resize:vertical;line-height:1.35}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;min-height:44px;font-weight:900;font-size:13.5px;color:var(--sub);cursor:pointer;padding:6px 4px}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center}
.thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1.5px solid var(--line)}
.map{width:100%;height:200px;border-radius:14px;border:1px solid var(--line);background:#0f1d2a}
.map.big{height:calc(100vh - 230px);min-height:380px}
.leaflet-container{font:inherit}
.pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.deck{position:relative;width:34px;height:34px}.deck i{position:absolute;left:0;top:0;width:26px;height:34px;border-radius:5px;border:1.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);background:var(--pub)}.deck i.c2{transform:translate(4px,-3px) rotate(6deg);opacity:.9}.deck i.c3{transform:translate(8px,-6px) rotate(12deg);opacity:.8}.deck i.public{background:var(--pub)}.deck i.mine{background:var(--mine)}.deck i.shared{background:var(--shared)}.deck i.place{background:#ff8c42}.deck b{position:absolute;right:-8px;bottom:-6px;min-width:20px;height:20px;border-radius:10px;background:#0c1722;color:#fff;border:2px solid #fff;font:900 11px/16px Nunito;text-align:center;padding:0 4px}.deck .ph{position:absolute;left:5px;top:9px;font-size:13px}
.pin.place{background:#ff8c42;border-radius:6px;transform:rotate(45deg);width:20px;height:20px}
.pin.public{background:var(--pub)}.pin.mine{background:var(--mine)}.pin.shared{background:var(--shared)}.pin.here{background:#4ea3ff;border-radius:50%;transform:none;width:16px;height:16px}
.counts{display:flex;gap:8px;flex-wrap:wrap}.counts span{display:inline-flex;align-items:center;gap:6px;font:800 13px Nunito;color:var(--sub)}.counts i{width:10px;height:10px;border-radius:50%;display:inline-block}
.spot{position:relative;border-radius:22px;padding:20px 18px 16px;background:linear-gradient(160deg,#1d3550,#0c1722);border:1px solid #2a4258;color:#eaf2f8;display:flex;flex-direction:column;gap:10px}
.spot.open{background:linear-gradient(160deg,#1f5a46,#0c1722);border-color:#2fd39c}
.spot .who{display:flex;align-items:center;gap:9px;font:800 13.5px Nunito;color:#b8cad8}.spot .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #f5b83d}
.spot .pinbadge{position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:50%;background:#f5b83d;display:grid;place-items:center;font-size:20px}
.spot .body{font:600 22px/1.25 Fredoka,sans-serif;text-wrap:balance;white-space:pre-wrap}
.spot .hid{font:600 22px/1.25 Fredoka,sans-serif;letter-spacing:.14em;color:#4b657d;filter:blur(2px);user-select:none}
.spot .clue{font:700 15px/1.4 Nunito;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.spot .meta{font:900 12.5px Nunito;letter-spacing:.08em;text-transform:uppercase;color:#ffcd5e}
.spot img.ph{width:100%;border-radius:14px;max-height:360px;object-fit:cover}
.dist{font:600 44px/1 Fredoka,sans-serif}
.log{display:flex;flex-direction:column;gap:8px}.log div{background:var(--field);border-radius:12px;padding:10px 12px;font-size:14.5px}.log small{display:block;color:var(--sub);font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit}
.item b{display:block;font-size:15px}.item small{color:var(--sub);font-size:12.5px}
select.in{min-height:44px;padding:8px 10px;font-size:14px;width:auto}
.hidden{display:none!important}
.err{color:var(--bad);font-size:14px;font-weight:800}
#gslot{min-height:44px;display:flex;justify-content:center}
.tent{background:#fff;color:#14202c;border-radius:0;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;border:1px dashed #999}
.tent h3{font:700 30px/1.1 Fredoka,sans-serif;margin:0}
.tent .big{font:700 22px/1.2 Fredoka,sans-serif}
.tent .small{font:700 14px Nunito;color:#566778}
@media print{body{background:#fff}.app{padding:0;max-width:none}.noprint{display:none!important}.tent{border:0;min-height:95vh;justify-content:center}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// That spot: leave a memory (text or photo) where you stand; it opens only for someone standing there. Makers sign in with Google.
// Map: public memories (green), yours (gold), shared with you (purple). A shared link needs Google sign-in, then zooms to the pin.
var SB_URL = 'https://setyjmgijsbplgyqynlh.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldHlqbWdpanNicGxneXF5bmxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDU0NTAsImV4cCI6MjEwNjEyMTQ1MH0.v8tjuc2UZrTw5whfDXtpEPW4CHggusgjq8Mkdh6ZMw8';
var GOOGLE_CLIENT_ID = '1084138810740-b2p2ln24ulfnrkb8mofppeist551u8bm.apps.googleusercontent.com';
var sb = null; try { sb = supabase.createClient(SB_URL, KEY, { auth: { persistSession: true } }); } catch (e) {}
var app = document.getElementById('app'), ME = null, SESSION = null, QA_TOKEN = null, LAST_POS = null;
function $(h){ stopHunt(); app.innerHTML = h; window.scrollTo(0, 0); }
function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function devId(){ var d = ls('vp.dev'); if (!d) { d = Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(b){ return b.toString(16).padStart(2, '0'); }).join(''); ls('vp.dev', d); } return d || 'nostorage'; }
(function(){ if (/[?&]admin=1/.test(location.search)) ls('vp.admin', '1'); var m = location.search.match(/[?&]src=([a-z0-9_-]{1,24})/i); if (m) { try { sessionStorage.setItem('vp.src', m[1]); if (!ls('vp.src0')) ls('vp.src0', m[1]); } catch (e) {} } })();
function src(){ try { return sessionStorage.getItem('vp.src') || ls('vp.src0') || 'direct'; } catch (e) { return 'direct'; } }
function track(step, meta){
  if (navigator.webdriver || /HeadlessChrome/.test(navigator.userAgent) || ls('vp.internal') === '1') return;
  var m = meta || {}; m.step = step;
  fetch(SB_URL + '/rest/v1/rpc/vp_track', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify({ p_dev: devId(), p_event: 'spot', p_tail: null, p_src: src(), p_meta: m }) }).catch(function(){});
}
function api(body){
  var tok = QA_TOKEN || (SESSION && SESSION.access_token) || KEY;
  return fetch(SB_URL + '/functions/v1/thatspot', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + tok }, body: JSON.stringify(body) })
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) { var e = new Error(j.error || r.status); e.data = j; throw e; } return j; }); });
}
function locate(){ return new Promise(function(res, rej){ if (!navigator.geolocation) return rej(new Error('No location on this device')); navigator.geolocation.getCurrentPosition(function(p){ LAST_POS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; res(LAST_POS); }, function(e){ rej(new Error(e.code === 1 ? 'Location permission was denied. Allow it for voterpup.com and try again.' : 'Could not get your location. Try outside, or wait a moment.')); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 15000 }); }); }
function fmt(iso){ return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
function fmtWhen(iso){ return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); }
function km(m){ return m < 1000 ? m + ' m' : (m / 1000).toFixed(1) + ' km'; }
function dirUrl(lat, lng){ return 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=walking'; }
function spotUrl(code){ return 'https://voterpup.com/myspot/?d=' + code; }
function placeUrl(code){ return 'https://voterpup.com/myspot/?at=' + code; }
function toast(t){ var e = document.getElementById('toast'); if (!e) { e = document.createElement('div'); e.id = 'toast'; e.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#eaf2f8;color:#0c1722;padding:12px 16px;border-radius:999px;font:800 14px Nunito;z-index:2000;max-width:90%'; document.body.appendChild(e); } e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(function(){ e.style.display = 'none'; }, 2800); }
function share(code, text){ var msg = text + ' ' + spotUrl(code); if (navigator.share) { navigator.share({ text: msg }).then(function(){ track('share', { how: 'share' }); }).catch(function(){}); return; } navigator.clipboard.writeText(msg).then(function(){ toast('Link copied. Paste it to them.'); track('share', { how: 'copy' }); }).catch(function(){ prompt('Copy this', msg); }); }
function myEmail(){ try { return (SESSION && SESSION.user && SESSION.user.email) || ''; } catch (e) { return ''; } }
function notifyBox(kind, code, title, sub){ return '<div class="box" id="nbox"><div style="font-weight:900">' + esc(title) + '</div><div class="muted">' + esc(sub) + '</div><div class="row"><input id="nem" class="in" type="email" placeholder="you@email.com" autocomplete="email" value="' + esc(myEmail()) + '"><button class="btn" id="ngo" style="flex:0 0 auto;width:auto;min-width:110px" data-kind="' + kind + '" data-code="' + code + '">Email me</button></div><div class="muted">Only when something happens. Unsubscribe in one tap.</div></div>'; }
function wireNotify(){ var b = document.getElementById('ngo'); if (!b) return; b.onclick = function(){ var em = document.getElementById('nem').value.trim(); if (!em) return; b.disabled = true; api({ action: 'notify', kind: b.dataset.kind, spot_code: b.dataset.code, email: em }).then(function(){ track('notify', { kind: b.dataset.kind }); document.getElementById('nbox').innerHTML = '<div style="font-weight:900">✓ We’ll email ' + esc(em) + ' when it happens.</div>'; }).catch(function(e){ toast('Could not save: ' + e.message); b.disabled = false; }); }; }
function hdr(){ return '<div class="top"><a class="logo" href="/myspot/">My spot</a><div class="me"><a class="lnk" href="/myspot/?map=1">Map</a>' + (ME ? '<a class="lnk" href="/myspot/?mine=1">Mine</a>' + (ME.photo ? '<img src="' + esc(ME.photo) + '" alt="">' : '') : '') + '</div></div>'; }

// ---------- Google sign-in (Google Identity button -> Supabase id-token session; same client as the main app) ----------
var _gis = null;

function sha256hex(str){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }); }
function inAppBrowser(){ return /Instagram|FBAN|FBAV|TikTok|musical_ly|Snapchat|Line\/|WhatsApp|; wv\)/i.test(navigator.userAgent); }
function googleButton(slot, after){
  if (inAppBrowser()) { slot.innerHTML = '<p class="muted">Google blocks sign-in inside this app. Open voterpup.com/myspot in Chrome or Safari.</p>'; return; }
  slot.innerHTML = '<p class="muted">Loading Google sign-in…</p>';
  var raw = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(16)), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
  Promise.all([loadGIS(), sha256hex(raw)]).then(function(v){
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, nonce: v[1], ux_mode: 'popup', callback: function(resp){
      slot.innerHTML = '<p class="muted">Signing in…</p>';

        .catch(function(e){ slot.innerHTML = '<p class="err">Sign-in didn’t finish: ' + esc(e.message) + '</p>'; }); } });
    slot.innerHTML = ''; google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: 280 });
  }).catch(function(e){ slot.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
}
function signinBox(why, sub){ return '<div class="box" id="signin"><div style="font-weight:900">' + esc(why || 'Sign in with Google') + '</div><div class="muted">' + esc(sub || 'A quick profile from your Google account: your name and photo, so people know who left it.') + '</div><div id="gslot"></div></div>'; }
function wireSignin(after){ var s = document.getElementById('gslot'); if (s) googleButton(s, after); }

// ---------- map helpers (Leaflet + OpenStreetMap tiles) ----------
function mkMap(el, lat, lng, zoom){ var m = L.map(el, { zoomControl: false, attributionControl: true }).setView([lat, lng], zoom || 15); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m); return m; }
function deckIcon(items){ var n = items.length, top = items[0], kinds = items.map(function(p){ return p.is_place ? 'place' : p.kind; }); var layers = (n >= 3 ? '<i class="c3 ' + (kinds[2]) + '"></i>' : '') + (n >= 2 ? '<i class="c2 ' + (kinds[1]) + '"></i>' : '') + '<i class="c1 ' + kinds[0] + '"></i>'; return L.divIcon({ className: '', html: '<div class="deck">' + layers + (top.has_photo ? '<span class="ph">📷</span>' : '') + (n > 1 ? '<b>' + n + '</b>' : '') + '</div>', iconSize: [34, 34], iconAnchor: [13, 34] }); }

function fallbackCentre(){ return LAST_POS || { lat: 49.2827, lng: -123.1207 }; }

// ---------- home: one screen, three steps ----------
function home(){
  if (!ME) {
    $(hdr() + '<div class="k">My spot</div><h1>Leave a memory at a spot. It opens only when they’re standing there.</h1><p class="lead">A note or a photo, buried where you stand. For yourself, for one person, or for anyone who finds it.</p>' +
      signinBox('Sign in to leave one') + '<a class="btn" href="/myspot/?map=1">See the map</a>' +

  var st = { photo: null, pos: null, vis: 'link', map: null, marker: null, at: new URLSearchParams(location.search).get('at') || null, atName: null };
  $(hdr() + (st.at ? '<div class="k" id="atname">Posting at this shop</div>' : '') + '<h1>Leave a memory here.</h1>' +
    '<div class="box"><div class="step"><div class="n" id="n1">1</div><div><div class="t">Write it, or snap a picture</div>' +

    '<div class="box"><div class="step"><div class="n" id="n2">2</div><div><div class="t">Place it where you stand</div><button class="btn sm" id="loc">Allow location</button><div class="muted" id="where">Your spot goes on the map once you allow it.</div><div class="map hidden" id="mini"></div></div></div></div>' +
    '<div class="box"><div class="step"><div class="n" id="n3">3</div><div><div class="t">Who can find it</div>' +
      '<div class="seg" id="vis"><button type="button" data-v="personal">Personal</button><button type="button" class="on" data-v="link">Private link</button><button type="button" data-v="public">Public</button></div>' +
      '<div class="muted" id="visnote">Only the person you send the link to. They sign in with Google and see the spot on the map.</div>' +
      (ls('vp.admin') === '1' ? '<label class="row" style="gap:10px;cursor:pointer"><input type="checkbox" id="isplace" style="width:22px;height:22px"><span style="font-weight:800">Create a shop spot (founder)</span></label><input id="pname" class="in hidden" maxlength="60" placeholder="Shop name, as customers know it">' : '') +
      '<input id="c" class="in" maxlength="140" placeholder="Clue for the exact spot (optional)">' +
      '<div class="err hidden" id="e"></div><button class="btn gold" id="go" disabled>Leave it here</button></div></div></div>' +

    api({ action: 'open', code: code, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }).then(function(r2){
      if (r2.there) { track('open_try', { there: true, d: r2.distance_m, live: true }); opened(code, s, r2); return; }
      if (r2.sealed) { opened(code, s, r2); return; }
      _bearing = r2.bearing_deg || _bearing; var d = document.getElementById('dist'); if (d) d.textContent = km(r2.distance_m); drawArrow();
    }).catch(function(){});
  }, function(){}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
function opened(code, s, r){
  if (r.sealed) { $(hdr() + '<div class="k">Not yet</div><h2>It opens ' + esc(fmtWhen(r.opens_at)) + '.</h2><p class="lead">Come back then. You’re ' + km(r.distance_m) + ' from the spot.</p><a class="btn" href="/myspot/?d=' + code + '">Back</a>'); return; }
  if (!r.there) { hunt(code, s, r); return; }
  function render(log){
    $(hdr() + '<div class="k">You found it</div><div class="spot open"><div class="pinbadge">📍</div><div class="who">' + (r.maker_photo ? '<img src="' + esc(r.maker_photo) + '" alt="">' : '') + esc(r.maker_name || 'Someone') + ' left this · ' + esc(fmt(r.buried_at)) + '</div>' + (r.photo_url ? '<img class="ph" src="' + esc(r.photo_url) + '" alt="">' : '') + (r.body ? '<div class="body">' + esc(r.body) + '</div>' : '') + '</div>' +
      '<div class="box"><div class="k">Logbook</div>' + (log.length ? '<div class="log">' + log.map(function(f){ return '<div>' + (f.note ? esc(f.note) : '<i>found it</i>') + '<small>' + esc(f.finder_name || 'Someone') + ' · ' + esc(fmt(f.created_at)) + '</small></div>'; }).join('') + '</div>' : '<div class="muted">You’re the first here.</div>') + '</div>' +
      (ME ? '<div class="box"><div style="font-weight:900">Leave a note here</div><textarea id="n" class="in" maxlength="300" placeholder="I was here. Thank you."></textarea><div class="err hidden" id="e"></div><button class="btn" id="rep">Leave it</button></div>' : signinBox('Sign in to leave a note here')) +
      '<a class="btn gold" href="/myspot/">Leave one back</a><a class="btn" href="/myspot/?map=1">See the map</a>');
    if (ME) { document.getElementById('rep').onclick = function(){ var n = document.getElementById('n').value.trim(), err = document.getElementById('e'); if (!n) return; this.disabled = true;
      locate().then(function(p){ return api({ action: 'reply', code: code, note: n, lat: p.lat, lng: p.lng, acc: p.acc }); }).then(function(j){ track('reply', {}); toast('Left here.'); render(j.logbook); })
        .catch(function(e){ err.textContent = e.message; err.classList.remove('hidden'); document.getElementById('rep').disabled = false; }); }; }
    else wireSignin(function(){ render(log); });
  }
  render(r.logbook || []); track('found', { role: r.is_maker ? 'maker' : 'finder' });
}

// ---------- mine ----------
function mine(){
  if (!ME) { $(hdr() + '<h2>Your memories</h2>' + signinBox('Sign in to see what you left')); wireSignin(mine); return; }
  $(hdr() + '<div class="k">Mine</div><h2>What you left.</h2><div class="list" id="l"><div class="muted">Loading…</div></div><a class="btn gold" href="/myspot/">Leave another</a><button class="lnk" id="out" style="align-self:center">Sign out</button>');
  document.getElementById('out').onclick = function(){ sb.auth.signOut().then(function(){ location.href = '/myspot/'; }); };
  api({ action: 'mine' }).then(function(j){ var l = document.getElementById('l'); if (!j.spots.length) { l.innerHTML = '<div class="muted">Nothing left yet.</div>'; return; }
    l.innerHTML = j.spots.map(function(s){ return '<div class="item" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><b>' + (s.kind === 'place' ? '🏪 ' + esc(s.place_name) + ': ' : '') + (s.has_photo ? '📷 ' : '') + esc((s.body || 'Photo').slice(0, 60)) + ((s.body || '').length > 60 ? '…' : '') + '</b><small>' + esc(fmt(s.created_at)) + ' · found ' + s.finds.length + '×' + (s.clue ? ' · ' + esc(s.clue) : '') + '</small></div>' +
      '<select class="in" data-code="' + s.code + '"><option value="personal"' + (s.visibility === 'personal' ? ' selected' : '') + '>Personal</option><option value="link"' + (s.visibility === 'link' ? ' selected' : '') + '>Private link</option><option value="public"' + (s.visibility === 'public' ? ' selected' : '') + '>Public</option><option value="hidden"' + (s.visibility === 'hidden' ? ' selected' : '') + '>Hidden</option></select>' +
      '<div style="flex-basis:100%;display:flex;gap:8px;margin-top:4px"><button class="btn sm" data-share="' + s.code + '" style="flex:1">Share</button><a class="btn sm" href="/myspot/?' + (s.kind === 'place' ? 'at=' : 'd=') + s.code + '" style="flex:1">Open</a><a class="btn sm" href="/myspot/?qr=' + s.code + '" style="flex:1">QR tent</a></div>' +
      (s.finds.length ? '<div class="log" style="flex-basis:100%;margin-top:6px">' + s.finds.slice(0, 5).map(function(f){ return '<div>' + (f.note ? esc(f.note) : '<i>found it</i>') + '<small>' + esc(f.finder_name || 'Someone') + ' · ' + esc(fmt(f.created_at)) + '</small></div>'; }).join('') + '</div>' : '') + '</div>'; }).join('');
    l.querySelectorAll('select').forEach(function(sel){ sel.onchange = function(){ api({ action: 'toggle', code: sel.dataset.code, visibility: sel.value }).then(function(){ track('toggle', { vis: sel.value }); toast('Now: ' + sel.options[sel.selectedIndex].text); }).catch(function(e){ toast('Could not change: ' + e.message); }); }; });
    l.querySelectorAll('[data-share]').forEach(function(b){ b.onclick = function(){ var sp = j.spots.filter(function(x){ return x.code === b.dataset.share; })[0]; if (sp && sp.kind === 'place') { var msg = '📍 ' + sp.place_name + ' is on My spot. A note from us that only opens inside, and a guestbook: ' + placeUrl(sp.code); if (navigator.share) navigator.share({ text: msg }).catch(function(){}); else navigator.clipboard.writeText(msg).then(function(){ toast('Place link copied.'); }); return; } share(b.dataset.share, '📍 I left a memory for you at a spot. It opens only when you’re standing there:'); }; });
  }).catch(function(e){ document.getElementById('l').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
  track('mine', {});
}

function boot(){ if (!sb) return Promise.resolve(); return sb.auth.getSession().then(function(r){ SESSION = r.data && r.data.session; return (SESSION || QA_TOKEN) ? api({ action: 'me' }).then(function(j){ ME = j.profile; }).catch(function(){ ME = null; }) : null; }); }
function tent(code){
  $('<div class="noprint">' + hdr() + '</div><div class="muted noprint">Loading…</div>');
  api({ action: 'peek', code: code }).then(function(s){
    var isPlace = s.kind === 'place'; var q = qrcode(0, 'M'); q.addData(isPlace ? placeUrl(code) : spotUrl(code)); q.make();
    $('<div class="noprint">' + hdr() + '<div class="row"><button class="btn gold" id="pr">Print</button><a class="btn" href="/myspot/?mine=1">Back</a></div><div class="muted">Prints as one page. Fold it, or tape it by the till.</div></div>' +
      '<div class="tent"><div class="small">' + (isPlace ? 'A NOTE FROM THE OWNER THAT ONLY OPENS HERE' : 'A NOTE THAT ONLY OPENS HERE') + '</div><h3>' + esc(isPlace ? s.place_name : (s.clue || ('A memory from ' + (s.maker_name || 'the owner')))) + '</h3>' +
      '<img alt="QR code" style="width:260px;height:260px" src="' + q.createDataURL(8, 0) + '">' +
      '<div class="big">Scan it. It opens because you’re standing here.</div><div class="small">Read the note, then leave your own in the guestbook.<br>voterpup.com/myspot · no app needed</div></div>');
    document.getElementById('pr').onclick = function(){ window.print(); };
    track('tent', {});
  }).catch(function(){ $(hdr() + '<h2>Nothing here.</h2>'); });
}
function route(){ var q = new URLSearchParams(location.search); if (q.get('qr')) tent(q.get('qr').replace(/[^a-z0-9]/g, '')); else if (q.get('at') && q.get('leave')) home(); else if (q.get('at')) place(q.get('at').replace(/[^a-z0-9]/g, '')); else if (q.get('d')) find(q.get('d').replace(/[^a-z0-9]/g, '')); else if (q.get('mine')) mine(); else if (q.get('map')) mapView(); else home(); }
window.__spot = { setQA: function(t){ QA_TOKEN = t; return boot().then(route); } };
boot().then(route);
</script>
<script data-goatcounter="https://voterpup.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
